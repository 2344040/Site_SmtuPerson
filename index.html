<!-- index.html -->

<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Преподаватели — СПбГМТУ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- * версия -->
  <link href="assets/style.css?v=34" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2312241f'/><stop offset='1' stop-color='%23d97b29'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23g)'/><text x='50' y='68' font-size='56' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>С</text></svg>">
  <script>
    /* Сохранённая схема (или тёмная схема ОС, если выбора не было) — до первой отрисовки */
    (function () {
      try {
        var t = localStorage.getItem('site-theme');
        if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <style>
    .tcard {
      display: block;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      height: 100%;
      transition: .25s;
    }

    .tcard:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 34px -20px rgba(18, 36, 31, .5);
      color: var(--ink);
    }

    .tcard img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: 50% 18%;
    }

    .tcard h3 {
      font-size: 1rem;
      padding: .8rem .9rem 0;
    }

    .tcard p {
      color: var(--muted);
      font-size: .8rem;
      padding: 0 .9rem .9rem;
      margin: 0;
    }

     /* Кнопка входа в админку (демо) */
    .btn-admin {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .45rem 1.1rem;
      font-size: .85rem;
      font-weight: 600;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      text-decoration: none;
      background: var(--surface);
      transition: .25s;
    }

    .btn-admin:hover {
      color: #fff;
      background: var(--amber);
      border-color: var(--amber);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="container-xl py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h1 class="sec-title mb-0">Преподаватели кафедры</h1>
      <a class="btn-admin" href="admin.html" title="Вход в админку: демо-режим без токена">
        <i class="bi bi-shield-lock"></i>Админ демо
      </a>
    </div>
    <div class="rule"></div>
    <div id="cards" class="row g-4"></div>
  </div>
  <script>
    fetch('data/teachers.json?v=' + Date.now()).then(r => r.json()).then(d => {
      const list = d.teachers.filter(t => !t.hidden);
      list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));
      document.getElementById('cards').innerHTML = list.map(t => `
      <div class="col-lg-3 col-md-4 col-sm-6"><a class="tcard" href="teacher.html?id=${t.id}">
      <img src="${t.photo}" alt=""><h3>${t.name}</h3><p>${t.post}</p>
    </a></div>`).join('');
    });
  </script>
</body>

</html>
