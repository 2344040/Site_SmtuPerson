<small class="text-secondary mt-2">Токен хранится только в вашей вкладке браузера и нужен для записи в репозиторий. Оставьте поле токена пустым, чтобы войти в демо-режим: просмотр и правка без публикации.</small>

<label class="form-check-label small text-secondary d-flex align-items-center gap-1 ms-2 mb-0" title="Карточка исчезнет с главной страницы, личная страница открываться не будет">
<input class="form-check-input" type="checkbox" id="hideChk" onchange="toggleHidden(this.checked)"> Не выводить
</label>
<button class="btn btn-outline-secondary btn-sm ms-2" onclick="syncForLLM()" title="Собрать актуальные файлы из репозитория и положить в буфер обмена для вставки в чат">↻</button>
<div class="d-flex gap-2 align-items-center ms-auto" style="flex-wrap:nowrap">
<button type="button" class="btn btn-outline-secondary btn-sm" onclick="bumpVersion()" title="Поднять версию ассетов на +1 в teacher.html и index.html и закоммитить в репозиторий">v+1</button>
<span class="ver-badge" id="verBadge" onclick="refreshVerBadge()" title="Версия teacher.js в teacher.html репозитория — кликните для обновления"></span>
<button class="btn btn-success btn-sm" onclick="save()">Сохранить и опубликовать</button>
</div>

</div>

<script>
/* ═══ НАСТРОЙКИ ═══ */
const OWNER = '2344040', REPO = 'Site_SmtuPerson', PATH = 'data/teachers.json';
const GATE = '2470';
/* Демо-режим: вход с пустым полем токена. Данные читаются из опубликованного JSON, правки никуда не отправляются. */
let DEMO = false;

/* Файлы для кнопки «↻ файлы для LLM» */
const LLM_FILES = ['admin.html', 'teacher.html', 'index.html', 'assets/teacher.js', 'assets/style.css'];

async function fetchFileRaw(p) {
const headers = { 'Accept': 'application/vnd.github.raw' };
if (TOK) headers.Authorization = 'Bearer ' + TOK;
const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + p, { headers });
if (!r.ok) return null;
return await r.text();
}

async function syncForLLM() {
const st = document.getElementById('status');
st.textContent = 'читаю файлы…';
const parts = [];
for (const p of LLM_FILES) {
const txt = await fetchFileRaw(p);
parts.push(txt === null
? `=== файл: ${p} ===\n[НЕ УДАЛОСЬ ПРОЧИТАТЬ — проверьте путь в LLM_FILES]`
: `=== файл: ${p} ===\n${txt}`);
}
const block = parts.join('\n\n');
try {
await navigator.clipboard.writeText(block);
st.innerHTML = `<span class="text-success fw-bold">✔</span> в буфере: ${block.length.toLocaleString('ru-RU')} симв.`;
} catch (e) {
const ta = document.createElement('textarea');
ta.value = block;
document.body.appendChild(ta);
ta.select();
document.execCommand('copy');
document.body.removeChild(ta);
st.innerHTML = `<span class="text-success fw-bold">✔</span> скопировано (fallback)`;
}
}

/* Бейдж версии: читаем teacher.html из репозитория и достаём ?v=NN */
async function refreshVerBadge() {
const el = document.getElementById('verBadge');
if (!el) return;
el.textContent = '…';
const txt = await fetchFileRaw('teacher.html');
const m = txt && txt.match(/teacher\.js\?v=(\d+)/);
el.textContent = m ? 'v.' + m[1] : 'v.—';
}

/* ═══ Подъём версии ассетов: один клик = все теги во всех HTML ═══ */
async function bumpVersion() {
if (DEMO) { alert('Подъём версии недоступен в демо-режиме: нужна запись в репозиторий.'); return; }
const st = document.getElementById('status');
st.textContent = 'поднимаю версию…';
try {
/* 1. Читаем оба HTML из репозитория */
const files = ['teacher.html', 'index.html'];
const cur = {};
for (const p of files) {
const r = await gh('/contents/' + p);
if (!r.ok) throw new Error('Не удалось прочитать ' + p + ': ' + r.status);
const j = await r.json();
cur[p] = { sha: j.sha, text: decodeURIComponent(escape(atob(j.content))) };
}
/* 2. Новый номер = максимум найденных + 1 */
let max = 0;
Object.values(cur).forEach(f => {
f.text.replace(/[?&]v=(\d+)/g, (s, n) => { max = Math.max(max, +n); return s; });
});
const next = max + 1;
/* 3. Меняем существующие ?v=NN у наших ассетов; голым ссылкам добавляем параметр */
const patch = t => t
.replace(/(assets\/(?:teacher\.js|style\.css)\?v=)\d+/g, (s, p1) => p1 + next)
.replace(/(assets\/(?:teacher\.js|style\.css))(")/g, (s, p1, p2) => p1 + '?v=' + next + p2);
/* 4. Пишем обратно (base64 через UTF-8-обёртку, кириллица не ломает btoa) */
for (const p of files) {
const nt = patch(cur[p].text);
if (nt === cur[p].text) continue;
const b64 = btoa(unescape(encodeURIComponent(nt)));
const r = await gh('/contents/' + p, {
method: 'PUT',
body: JSON.stringify({ message: 'admin: bump assets version to v' + next, content: b64, sha: cur[p].sha })
});
if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error('Запись ' + p + ': ' + r.status + ' ' + (e.message || '')); }
}
st.innerHTML = `<span class="text-success fw-bold">✔</span> версия v${next}`;
refreshVerBadge();
} catch (err) {
st.innerHTML = '<span class="text-danger fw-bold">✗</span> версия';
alert('Исключение при подъёме версии: ' + err.message);
}
}

// * SCALAR
const SCALAR = {
id: ['ID (латиницей)', 'col-md-3'],

/* Склоняем слово «кафедра» в начале названия кафедры */
const declineKafedra = (dep, instr) => String(dep || '').trim()
.replace(/^базовая\s+кафедра/i, instr ? 'базовой кафедрой' : 'базовой кафедры')
.replace(/^кафедра/i, instr ? 'кафедрой' : 'кафедры');
/* Должность под ФИО: должность + кафедра (заведующий — творительный, остальные — родительный) */
const composePost = (pos, dep) => {
let p = String(pos || '').trim();
if (!p) return '';
/* Убираем хвост «кафедрой/кафедры» из должности, чтобы не удваивался */
p = p.replace(/\s+(?:базовой\s+)?кафедр(?:ой|ы)\.?$/i, '').trim();
const instr = /заведующ|зав\./i.test(p) && !/лаборатор|отдел|центр|сектор|часть|кабинет|музей/i.test(p);
const d = declineKafedra(dep, instr);
return d ? p + ' ' + d : p;
};

/* Миграции данных — общие для боевого и демо-режима */
function migrate(d) {
(d.teachers || []).forEach(t => {
/* ФИО без неразрывных пробелов и двойных пробелов — чтобы шапка делилась на две строки */
if (t.name) t.name = String(t.name).replace(/[\u00A0\u2007\u202F]/g, ' ').replace(/\s{2,}/g, ' ').trim();
/* Из старого post извлекаем должность для справочника (post не трогаем) */
if (!t.position && t.post) {
const m = String(t.post).match(/^(.+?)\s+(?:базовой\s+кафедры|базовой\s+кафедрой|кафедры|кафедрой)\b/i);
if (m) t.position = m[1].trim();
}
/* Легаси-нормализация полей внутри строк books/publications */
['books', 'publications'].forEach(k => {
(t[k] || []).forEach(row => {
if (row.text && !row.biblio) { row.biblio = row.text; delete row.text; }
if (row.link && !row.url) { row.url = row.link; delete row.link; }
});
});
/* Сборка единого раздела «Публикации»: целые массивы уходят в новые рубрики.
Стоит ПОСЛЕ нормализации полей, чтобы переехали уже исправленные строки */

async function load() {
const r = await gh('/contents/' + PATH);
if (!r.ok) return alert('Токен не принят: ' + r.status);
data = JSON.parse(decodeURIComponent(escape(atob((await r.json()).content))));
migrate(data);
enterAdmin();
}

async function loadDemo() {
const r = await fetch(PATH + '?v=' + Date.now());
if (!r.ok) return alert('Не удалось загрузить данные: ' + r.status);
data = await r.json();
migrate(data);
enterAdmin();
}

// * MAT TREE — редактор учебных материалов (дерево разделов и записей)
const MAT_SECS_LIST = ['mat_posobia', 'mat_books', 'mat_lectures', 'mat_video', 'mat_resources'];
const MAT_FIELDS = {
mat_posobia: ['author', 'title', 'biblio', 'description', 'url'],
mat_books: ['author', 'title', 'biblio', 'url', 'url_buy'],
mat_lectures: ['author', 'title', 'url'],
mat_video: ['author', 'title', 'url'],
mat_resources: ['title', 'url'],
};

/* Служебный id узла (не перечислимый → не попадает в JSON и не виден фронту)
и память свёрнутости, переживающая любые перерисовки */
let MAT_UID_SEQ = 1;
const matSetUid = (node, uid) => Object.defineProperty(node, '__uid', { value: uid, enumerable: false, configurable: true });
const matUid = node => node.__uid || (matSetUid(node, 'u' + (MAT_UID_SEQ++)), node.__uid);
const MAT_COLLAPSED = new Set();

/* Плоские строки с rub → дерево + схлопывание «книга, разбитая на главы» */
function migrateMatTree(t, sec) {
const arr = t[sec];
if (!Array.isArray(arr) || !arr.length || arr[0].kind) return;
const root = [];
const findHead = (siblings, title) => {
let h = siblings.find(n => n.kind === 'head' && n.title === title);
if (!h) { h = { kind: 'head', title, children: [] }; siblings.push(h); }
return h;
};
arr.forEach(row => {
const path = String(row.rub || '').split(/[\/›>|]/).map(s => s.trim()).filter(Boolean);
let siblings = root;
path.forEach(p => { const h = findHead(siblings, p); siblings = h.children; });
const node = { kind: 'rec' };
(MAT_FIELDS[sec] || []).forEach(c => { if (row[c] !== undefined) node[c] = row[c]; });
siblings.push(node);
});
const collapse = siblings => {
const out = [];
siblings.forEach(n => {
if (n.children) collapse(n.children);
if (n.kind === 'head' && (n.children || []).length &&
n.children.every(c => c.kind === 'head' && (c.children || []).length === 1 && c.children[0].kind === 'rec')) {
const recs = n.children.map(c => c.children[0]);
const sig = r => [r.author || '', r.title || '', r.biblio || ''].join('|');
if (recs.every(r => sig(r) === sig(recs[0]))) {
const container = Object.assign({}, recs[0]);
delete container.url; delete container.url_buy;
container.children = n.children.map(c => {
const r = c.children[0];
const child = { kind: 'rec', title: c.title };
if (r.url) child.url = r.url;
if (r.url_buy) child.url_buy = r.url_buy;
return child;
});
out.push(container);
return;
}
}
out.push(n);
});
siblings.length = 0;
out.forEach(n => siblings.push(n));
};
collapse(root);
t[sec] = root;
}
const matArr = (t, sec, path) => {
if (!Array.isArray(t[sec])) t[sec] = [];
if (!path) return t[sec];
let arr = t[sec];
path.split('.').map(Number).forEach(i => {
const node = arr[i];
if (!node.children) node.children = [];
arr = node.children;
});
return arr;
};
function matToggle(btn) {
const card = btn.closest('.mat-node');
const collapsed = card.classList.toggle('collapsed');
const key = card.dataset.sec + '|' + card.dataset.uid;
if (collapsed) MAT_COLLAPSED.add(key); else MAT_COLLAPSED.delete(key);
btn.textContent = collapsed ? '▸' : '▾';
}
function matAdd(sec, path, kind) {
collect();
const t = data.teachers[cur];
const node = { kind };
if (kind === 'rec') (MAT_FIELDS[sec] || []).forEach(c => node[c] = '');
node.children = [];
matArr(t, sec, path).push(node);
build();
/* Родителя, в которого добавляем, раскрываем — иначе новичка не видно */
if (path) {
const pcard = document.querySelector(`.mat-node[data-sec="${sec}"][data-path="${path}"]`);
if (pcard && pcard.classList.contains('collapsed')) {
pcard.classList.remove('collapsed');
MAT_COLLAPSED.delete(sec + '|' + pcard.dataset.uid);
const pbtn = pcard.querySelector(':scope > .mat-node-bar > button');
if (pbtn) pbtn.textContent = '▾';
}
}
const box = path
? document.querySelector(`.mat-node[data-sec="${sec}"][data-path="${path}"] > .mat-node-body > .mat-children`)
: document.querySelector(`.mat-root[data-sec="${sec}"]`);
if (box && box.lastElementChild) box.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
/* Добавить узел того же типа рядом, на уровне текущей карточки */
function matAddSibling(sec, path) {
collect();
const t = data.teachers[cur];
const p = path.split('.').map(Number);
const i = p.pop();
const arr = matArr(t, sec, p.join('.'));
const kind = arr[i] ? arr[i].kind : 'rec';
const node = { kind };
if (kind === 'rec') (MAT_FIELDS[sec] || []).forEach(c => node[c] = '');
node.children = [];
arr.splice(i + 1, 0, node);
build();
const np = (p.length ? p.join('.') + '.' : '') + (i + 1);
const el = document.querySelector(`.mat-node[data-sec="${sec}"][data-path="${np}"]`);
if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function matMove(sec, path, dir) {
collect();
const t = data.teachers[cur];
const p = path.split('.').map(Number);
const i = p.pop();
const arr = matArr(t, sec, p.join('.'));
const j = i + dir;
if (j < 0 || j >= arr.length) return;
[arr[i], arr[j]] = [arr[j], arr[i]];
build();
}
/* Перемещение по уровням: ⇥ вложить в предыдущий узел, ⇤ поднять к родителю */
function matNest(sec, path, dir) {
collect();
const t = data.teachers[cur];
const p = path.split('.').map(Number);
const i = p.pop();
const parentArr = matArr(t, sec, p.join('.'));
const node = parentArr[i];
if (!node) return;
if (dir === 1) {
/* Вложить: узел становится последним ребёнком предыдущего соседа */
if (i === 0) return;
const host = parentArr[i - 1];
if (!host.children) host.children = [];
parentArr.splice(i, 1);
host.children.push(node);
} else {
/* Наружу: узел встаёт сразу после своего родителя на его уровне */
if (!p.length) return;
const gi = p.pop();
const grandArr = matArr(t, sec, p.join('.'));
parentArr.splice(i, 1);
grandArr.splice(gi + 1, 0, node);
}
build();
}
function matRm(sec, path) {
if (!confirm('Удалить узел вместе со всем вложением?')) return;
collect();
const t = data.teachers[cur];
const p = path.split('.').map(Number);
const i = p.pop();
matArr(t, sec, p.join('.')).splice(i, 1);
build();
}
const escAttr = v => String(v ?? '').replace(/"/g, '&quot;');
const escTa = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');

function matNodeCard(sec, node, path, depth) {
const isHead = node.kind === 'head';
const fields = MAT_FIELDS[sec] || [];
const uid = matUid(node);
const isCol = MAT_COLLAPSED.has(sec + '|' + uid);
const pp = path.split('.');
const idx = +pp[pp.length - 1];
const inputs = isHead
? `<div class="row g-2"><div class="col-12"><input class="form-control form-control-sm" data-sec="${sec}" data-path="${path}" data-k="title" value="${escAttr(node.title)}" placeholder="Заголовок"></div></div>`
: (() => {
const has = c => fields.includes(c);
const inp = c => `<input class="form-control form-control-sm" data-sec="${sec}" data-path="${path}" data-k="${c}" value="${escAttr(node[c])}">`;
const urlCtrl = c => {
const plain = inp(c);
return (c === 'url' && sec !== 'mat_video' && !DEMO)
? `<div class="d-flex gap-1">${plain}<button type="button" class="btn btn-sm btn-outline-secondary btn-upload mat-upload" data-sec="${sec}" data-path="${path}" data-k="${c}" onclick="pickAndUploadMat('${sec}','${path}','${c}')" title="Загрузить файл в репозиторий и вставить ссылку"><i class="bi bi-cloud-arrow-up"></i></button></div>`
: plain;
};
const hasDesc = has('description'), hasBuy = has('url_buy');
const urlCol = hasDesc ? (hasBuy ? 'col-md-4' : 'col-md-6') : (hasBuy ? 'col-md-6' : 'col');
return `<div class="row g-2">
${has('author') ? `<div class="col-md-3"><label class="small text-secondary">${colName(sec, 'author')}</label>${inp('author')}</div>` : ''}
<div class="col"><label class="small text-secondary">${colName(sec, 'title')}</label>${inp('title')}</div>
${has('biblio') ? `<div class="col-md-3"><label class="small text-secondary">${colName(sec, 'biblio')}</label>${inp('biblio')}</div>` : ''}
</div>
${(hasDesc || has('url') || hasBuy) ? `<div class="row g-2 mt-1">
${hasDesc ? `<div class="col"><label class="small text-secondary">${colName(sec, 'description')}</label><textarea rows="1" class="form-control form-control-sm" data-sec="${sec}" data-path="${path}" data-k="description">${escTa(node.description)}</textarea></div>` : ''}
${has('url') ? `<div class="${urlCol}"><label class="small text-secondary">${colName(sec, 'url')}</label>${urlCtrl('url')}</div>` : ''}
${hasBuy ? `<div class="col-md-3"><label class="small text-secondary">${colName(sec, 'url_buy')}</label>${inp('url_buy')}</div>` : ''}
</div>` : ''}`;
})()
const kindLabel = isHead ? (depth === 0 ? 'раздел' : 'подраздел') : 'запись';
return `<div class="mat-node ${isHead ? 'mat-node-head' : 'mat-node-rec'} mat-depth-${Math.min(depth, 3)}${isCol ? ' collapsed' : ''}" data-sec="${sec}" data-path="${path}" data-kind="${node.kind}" data-uid="${uid}">
<div class="mat-node-bar">
<button type="button" class="btn btn-sm btn-outline-secondary" onclick="matToggle(this)" title="Свернуть/развернуть">${isCol ? '▸' : '▾'}</button>
<span class="me-1">${isHead ? '📁' : '📄'}</span>
<span class="small text-secondary me-auto mat-node-label" data-base="${kindLabel}">${kindLabel}${(node.title || '').trim() ? ': ' + escTa(node.title) : ''}</span>
<button type="button" class="btn btn-sm btn-outline-secondary" onclick="matMove('${sec}','${path}',-1)" title="Выше среди соседей">↑</button>
<button type="button" class="btn btn-sm btn-outline-secondary" onclick="matMove('${sec}','${path}',1)" title="Ниже среди соседей">↓</button>
<button type="button" class="btn btn-sm btn-outline-secondary" onclick="matNest('${sec}','${path}',1)" title="Вложить в узел выше (сделать его последним подразделом/вложением)" ${idx === 0 ? 'disabled' : ''}>⇥</button>
<button type="button" class="btn btn-sm btn-outline-secondary" onclick="matNest('${sec}','${path}',-1)" title="Поднять на уровень выше, сразу после родителя" ${depth === 0 ? 'disabled' : ''}>⇤</button>
<button type="button" class="btn btn-sm btn-outline-danger" onclick="matRm('${sec}','${path}')" title="Удалить">✕</button>
<button type="button" class="btn btn-sm btn-outline-dark ms-2" onclick="matAddSibling('${sec}','${path}')" title="Добавить ${isHead ? 'заголовок' : 'запись'} рядом, на этом же уровне">+ ${isHead ? 'заголовок' : 'строка'}</button>
<button type="button" class="btn btn-sm btn-outline-secondary" onclick="matAdd('${sec}','${path}','head')" title="Подраздел внутри этого узла"><i class="bi bi-folder-plus"></i></button>
<button type="button" class="btn btn-sm btn-outline-secondary" onclick="matAdd('${sec}','${path}','rec')" title="Запись внутри этого узла"><i class="bi bi-file-earmark-plus"></i></button>
</div>
<div class="mat-node-body">
${inputs}
<div class="mat-children">${(node.children || []).map((c, i) => matNodeCard(sec, c, path + '.' + i, depth + 1)).join('')}</div>
</div>
</div>`;
}
const matCountRec = nodes => nodes.reduce((n, x) => n + (x.kind === 'rec' ? 1 : 0) + matCountRec(x.children || []), 0);
let MAT_OPEN = {};
function renderMatEditor(t, sec) {
const arr = Array.isArray(t[sec]) ? t[sec] : (t[sec] = []);
const isOpen = (MAT_OPEN[sec] !== undefined) ? MAT_OPEN[sec] : true;
return `<details class="mat-sec" data-msec="${sec}" ${isOpen ? 'open' : ''}>
<summary>${NAMES[sec]}<span class="mat-sec-count">${matCountRec(arr)}</span></summary>
<div class="mat-sec-body">
<div class="mat-root" data-sec="${sec}">${arr.map((n, i) => matNodeCard(sec, n, String(i), 0)).join('')}</div>
<div class="d-flex gap-2 mt-1 mb-2">
<button type="button" class="btn btn-sm btn-outline-dark" onclick="matAdd('${sec}','','head')">+ заголовок</button>
<button type="button" class="btn btn-sm btn-outline-dark" onclick="matAdd('${sec}','','rec')">+ запись</button>
</div>
</div>
</details>`;
}
const collectMatNodes = box => {
const out = [];
box.querySelectorAll(':scope > .mat-node').forEach(card => {
const node = { kind: card.dataset.kind };
if (card.dataset.uid) matSetUid(node, card.dataset.uid);
card.querySelectorAll(':scope > .mat-node-body > .row input[data-k], :scope > .mat-node-body > .row textarea[data-k]').forEach(inp => { node[inp.dataset.k] = inp.value; });
const kids = card.querySelector(':scope > .mat-node-body > .mat-children');
const cn = kids ? collectMatNodes(kids) : [];
if (cn.length) node.children = cn;
out.push(node);
});
return out;
};

// * build
function build() {
const t = data.teachers[cur];
const openState = {};
document.querySelectorAll('#secs details[data-g]').forEach(d => {
openState[d.dataset.g] = d.open;
});
MAT_OPEN = {};
document.querySelectorAll('#secs details[data-msec]').forEach(d => { MAT_OPEN[d.dataset.msec] = d.open; });
document.getElementById('secs').innerHTML = GROUPS.map((g, gi) => {
let inner = '', rowBuf = null;
const flush = () => { if (rowBuf !== null) { inner += '<div class="row g-2">' + rowBuf + '</div>'; rowBuf = null; } };
g.items.forEach(([type, key, opt]) => {
if (type === 's') {
const [label, w] = SCALAR[key];
const v = t[key] || DEFAULTS[key] || '';
let ctrl;
if (key === 'faculty') {
const opts = (v && !FACULTIES.includes(v)) ? [v, ...FACULTIES] : FACULTIES;
ctrl = `<select class="form-select form-select-sm" data-f="${key}" onchange="collect(); build()">
<option value="" ${!v ? 'selected' : ''}>—</option>
${opts.map(f => `<option value="${f.replace(/"/g, '&quot;')}" ${v === f ? 'selected' : ''}>${f}</option>`).join('')}
</select>`;
} else if (key === 'department') {
const deps = DEPARTMENTS[t.faculty] || [];
const opts = (v && !deps.includes(v)) ? [v, ...deps] : deps;
ctrl = `<select class="form-select form-select-sm" data-f="${key}">
<option value="" ${!v ? 'selected' : ''}>—</option>
${opts.map(f => `<option value="${f.replace(/"/g, '&quot;')}" ${v === f ? 'selected' : ''}>${f}</option>`).join('')}
</select>`;
} else if (key === 'position') {
ctrl = `<input class="form-control form-control-sm" data-f="${key}" list="dl-position" value="${String(v).replace(/"/g, '&quot;')}">
<datalist id="dl-position">${positionOptions().map(p => `<option value="${String(p).replace(/"/g, '&quot;')}"></option>`).join('')}</datalist>`;
} else if (key === 'degree_level' || key === 'degree_branch' || key === 'academic_title') {
const opts = key === 'degree_level' ? DEGREE_LEVELS : key === 'degree_branch' ? DEGREE_BRANCHES : ACADEMIC_TITLES;
const list = (v && !opts.includes(v)) ? [v, ...opts] : opts;
ctrl = `<select class="form-select form-select-sm" data-f="${key}">
<option value="" ${!v ? 'selected' : ''}>—</option>
${list.map(f => `<option value="${f.replace(/"/g, '&quot;')}" ${v === f ? 'selected' : ''}>${f}</option>`).join('')}
</select>`;
} else {
ctrl = `<input class="form-control form-control-sm" data-f="${key}" value="${String(v).replace(/"/g, '&quot;')}">`;
}
rowBuf = (rowBuf || '') + `<div class="${w}"><label class="small text-secondary">${label}</label>${ctrl}</div>`;
} else if (type === 't') {
const [label, rows] = TEXTS[key];
rowBuf = (rowBuf || '') + `<div class="col-12"><label class="small text-secondary">${label}</label>
<textarea class="form-control form-control-sm" rows="${rows}" data-f="${key}">${(t[key] || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea></div>`;
} else {
flush();
if (type === 'H') inner += `<div class="fw-semibold small mt-3 mb-1" style="color:#2f6f63">${NAMES[key]}</div>`;
else if (type === 'a') inner += renderArray(t, key, opt);
else if (type === 'm') inner += renderMatEditor(t, key);
else if (type === 'h') inner += renderHtmlField(t, key);
else if (type === 'x') inner += `<div class="mt-4 mb-1">
<label class="small fw-semibold" style="color:#2f6f63">Ссылка на полное расписание (внешний URL)</label>
<input class="form-control form-control-sm" data-ext="${key}" placeholder="https://..." value="${(t.external_links?.[key] || '').replace(/"/g, '&quot;')}">
</div>`;
}
});
flush();
const isOpen = (openState[gi] !== undefined) ? openState[gi] : !!g.open;
return `<details class="card p-2 mb-2" data-g="${gi}" ${isOpen ? 'open' : ''}>
<summary class="fw-bold">${g.title}</summary>
<div class="mt-2">${inner}</div>
</details>`;
}).join('');

/* Автогенерация: должность есть, post пуст — заполняем */
const pi = document.querySelector('[data-f="position"]');
const po = document.querySelector('[data-f="post"]');
if (pi && po && pi.value.trim() && !po.value.trim()) {
po.value = composePost(pi.value, document.querySelector('[data-f="department"]')?.value || '');
}
/* 1-я строка должностей равна текущему post (если post заполнен) */
const pos0 = document.querySelector('[data-sec="positions"][data-i="0"]');
if (po && pos0 && po.value.trim()) pos0.value = po.value;

const hc = document.getElementById('hideChk');
if (hc) hc.checked = !!data.teachers[cur].hidden;
}

/* ═══ Сбор данных из формы ═══ */
function collect() {
const t = data.teachers[cur];
document.querySelectorAll('[data-f]').forEach(i => t[i.dataset.f] = i.value);
/* Основная должность зеркалит поле «Должность под ФИО» (если оно заполнено) */
const postVal = String(t.post || '').trim();
if (postVal) {
if (!Array.isArray(t.positions)) t.positions = [];
t.positions[0] = postVal;
}
if (!String(t.short || '').trim()) t.short = makeShort(t.name);
if (!t.external_links) t.external_links = {};
document.querySelectorAll('[data-ext]').forEach(i => t.external_links[i.dataset.ext] = i.value);
Object.keys(KEYS).forEach(k => { t[k] = []; });
document.querySelectorAll('input[data-sec][data-i][data-k], textarea[data-sec][data-i][data-k], select[data-sec][data-i][data-k]').forEach(i => {
const sec = i.dataset.sec, idx = +i.dataset.i, k = i.dataset.k;
const row = (t[sec][idx] = t[sec][idx] || (KEYS[sec][0] === '*' ? '' : {}));
if (KEYS[sec][0] === '*') t[sec][idx] = i.value;
else row[k] = i.type === 'checkbox' ? i.checked : i.value;
});

MAT_SECS_LIST.forEach(sec => {
const rootEl = document.querySelector(`.mat-root[data-sec="${sec}"]`);
if (rootEl) t[sec] = collectMatNodes(rootEl);
});
}

// * add(k)
function add(k) {
collect();
const t = data.teachers[cur];
const prevRow = t[k] && t[k].length ? t[k][t[k].length - 1] : null;
const fresh = KEYS[k][0] === '*' ? '' : Object.fromEntries(KEYS[k].map(c => [c, '']));
if (k.startsWith('mat_') && prevRow && prevRow.rub) fresh.rub = prevRow.rub;
t[k].push(fresh);
build();
const newRow = document.querySelector(`[data-sec="${k}"][data-i="${t[k].length - 1}"]`);
if (newRow) {
newRow.closest('tr').scrollIntoView({ behavior: 'smooth', block: 'center' });
if (newRow.focus) newRow.focus({ preventScroll: true });
}
}

function rm(k, i) {
collect();
data.teachers[cur][k].splice(i, 1);
build();
}

function addTeacher() {
collect();
data.teachers.push({
id: 'new' + Date.now(), name: 'Новый преподаватель',
chips: [], positions: [], education: [], career: [], news: [],
university: 'СПбГМТУ'
});
cur = data.teachers.length - 1;
rememberCur();
buildSel(); build();
}

function delTeacher() {
if (!confirm('Удалить преподавателя?')) return;
collect();
data.teachers.splice(cur, 1);
cur = Math.max(0, Math.min(cur, data.teachers.length - 1));
rememberCur();
buildSel(); build();
}

/* ═══ Загрузка файла в репозиторий (папка files/) ═══ */
const FILES_DIR = 'files';
const sanitizeName = name => String(name || 'file').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_').trim() || 'file';
async function uploadFileToRepo(file, onSuccess, btn) {
if (DEMO) { alert('В демо-режиме загрузка недоступна: нужен токен GitHub для записи в репозиторий.'); return; }
if (!file) return;
if (file.size > 100 * 1024 * 1024) { alert('Файл больше 100 МБ — ограничение GitHub API. Загрузите через веб-интерфейс репозитория.'); return; }
const name = sanitizeName(file.name);
const path = FILES_DIR + '/' + name;
const st = document.getElementById('status');
const prevIcon = btn ? btn.innerHTML : '';
if (btn) { btn.classList.add('uploading'); btn.innerHTML = '<span class="spinner-border"></span>'; }
st.textContent = 'загружаю ' + name + '…';
try {
/* 1. Читаем sha существующего файла (если есть) — нужен для перезаписи */
let sha = null;
try {
const probe = await gh('/contents/' + path);
if (probe.ok) { const j = await probe.json(); sha = j.sha; }
} catch (e) { /* файла ещё нет — это нормально */ }
/* Если файл существует — спрашиваем */
if (sha && !confirm('Файл «' + name + '» уже существует в репозитории. Перезаписать?')) {
if (btn) { btn.classList.remove('uploading'); btn.innerHTML = prevIcon; }
st.textContent = '';
return;
}
/* 2. Читаем содержимое как base64 */
const b64 = await new Promise((res, rej) => {
const r = new FileReader();
r.onload = () => res(r.result.split(',')[1]);
r.onerror = () => rej(r.error);
r.readAsDataURL(file);
});
/* 3. PUT — создаём или обновляем */
const body = {
message: 'admin: upload ' + name + ' (' + new Date().toISOString().slice(0, 10) + ')',
content: b64,
path: path
};
if (sha) body.sha = sha;
const r = await gh('/contents/' + path, { method: 'PUT', body: JSON.stringify(body) });
if (!r.ok) {
const e = await r.json().catch(() => ({}));
throw new Error('HTTP ' + r.status + ': ' + (e.message || JSON.stringify(e)));
}
/* 4. Успех — относительный путь для GitHub Pages */
const relUrl = path;
st.innerHTML = `<span class="text-success fw-bold">✔</span> ${name} загружен`;
onSuccess(relUrl);
} catch (err) {
st.innerHTML = '<span class="text-danger fw-bold">✗</span> загрузка не удалась';
alert('Ошибка загрузки:\n' + err.message);
} finally {
if (btn) { btn.classList.remove('uploading'); btn.innerHTML = prevIcon; }
setTimeout(() => { if (st.textContent.startsWith('загружаю')) st.textContent = ''; }, 3000);
}
}
/* Триггер скрытого input[type=file] */
function pickAndUpload(sec, idx, field) {
const inp = document.createElement('input');
inp.type = 'file';
inp.onchange = async () => {
const f = inp.files && inp.files[0];
if (!f) return;
const btn = document.querySelector(`.btn-upload[data-sec="${sec}"][data-i="${idx}"][data-k="${field}"]`);
await uploadFileToRepo(f, url => {
collect();
const t = data.teachers[cur];
if (!Array.isArray(t[sec])) t[sec] = [];
const row = t[sec][idx] = t[sec][idx] || {};
row[field] = url;
build();
}, btn);
};
inp.click();
}
function pickAndUploadMat(sec, path, field) {
const inp = document.createElement('input');
inp.type = 'file';
inp.onchange = async () => {
const f = inp.files && inp.files[0];
if (!f) return;
const btn = document.querySelector(`.mat-upload[data-sec="${sec}"][data-path="${path}"][data-k="${field}"]`);
await uploadFileToRepo(f, url => {
collect();
const t = data.teachers[cur];
const p = path.split('.').map(Number);
const i = p.pop();
let arr = Array.isArray(t[sec]) ? t[sec] : (t[sec] = []);
p.forEach(j => {
const n = arr[j];
if (!n.children) n.children = [];
arr = n.children;
});
if (arr[i]) arr[i][field] = url;
build();
const card = document.querySelector(`.mat-node[data-sec="${sec}"][data-path="${path}"]`);
if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}, btn);
};
inp.click();
}

// * save
/* ═══ Сохранение в GitHub ═══ */
async function save() {
collect();
const st = document.getElementById('status');
if (DEMO) {
st.innerHTML = '<span class="text-warning fw-bold">ДЕМО: правки не отправлены в GitHub</span>';
alert('Демо-режим: изменения остаются только в этой вкладке браузера.');
return;
}
st.textContent = 'сохраняю…';
try {
const g = await gh('/contents/' + PATH);
if (!g.ok) {
const e = await g.json().catch(() => ({}));
alert('Не удалось прочитать файл:\nGET ' + g.status + '\n' + (e.message || ''));
st.textContent = '✗ GET ' + g.status; return;
}
const curFile = await g.json();
const json = JSON.stringify(data, null, 1);
const b64 = btoa(unescape(encodeURIComponent(json)));
const r = await gh('/contents/' + PATH, {
method: 'PUT',
body: JSON.stringify({
message: 'admin: update ' + new Date().toISOString(),
content: b64, sha: curFile.sha
})
});
const res = await r.json().catch(() => ({}));
if (r.ok) {
const stamp = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
st.innerHTML = `<span class="text-success fw-bold">✔</span> ${stamp}`;
} else {
st.innerHTML = `<span class="text-danger fw-bold">✗</span> ${r.status}`;
alert('Ошибка ' + r.status + '\n' + (res.message || JSON.stringify(res)));
}
} catch (err) { st.textContent = '✗ сбой скрипта'; alert('Исключение: ' + err); }
}

// * wrapSel
function wrapSel(ta, before, after) {
const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
ta.value = v.slice(0, s) + before + v.slice(s, e) + after + v.slice(e);
ta.focus();
ta.selectionStart = s + before.length;
ta.selectionEnd = e + before.length;
ta.dispatchEvent(new Event('input', { bubbles: true }));
}

// * listSel
function listSel(ta, tag) {
const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
const lines = v.slice(s, e).split(/\r?\n/).map(l => l.replace(/^[-•*\d.)\s]+/, '').trim()).filter(Boolean);
const items = (lines.length ? lines : ['']).map(l => '  <li>' + l + '</li>').join('\n');
const insert = tag === 'li'
? items
: '<' + tag + (tag === 'ul' ? " class='text-block-list'" : '') + '>\n' + items + '\n</' + tag + '>';
ta.value = v.slice(0, s) + insert + v.slice(e);
ta.focus();
ta.selectionStart = ta.selectionEnd = s + insert.length;
ta.dispatchEvent(new Event('input', { bubbles: true }));
}

document.addEventListener('click', e => {
const b = e.target.closest('.html-tools button');
if (!b) return;
const ta = document.getElementById(b.closest('.html-tools').dataset.target);
if (!ta) return;
if (b.dataset.list) { listSel(ta, b.dataset.list); return; }
const [before, after] = b.dataset.wrap.split('|');
wrapSel(ta, before, after);
});

document.addEventListener('input', e => {
const f = e.target.dataset ? e.target.dataset.f : '';
const prev = f ? document.getElementById('prev-' + f) : null;
if (prev) prev.innerHTML = e.target.value;
});

/* Регенерация «Должность под ФИО» + зеркало в 1-ю строку должностей */
document.addEventListener('input', e => {
const f = e.target.dataset ? e.target.dataset.f : '';
if (f !== 'position' && f !== 'department' && f !== 'post') return;
const pos = document.querySelector('[data-f="position"]');
const dep = document.querySelector('[data-f="department"]');
const post = document.querySelector('[data-f="post"]');
if (!post) return;
if (f !== 'post') post.value = composePost(pos ? pos.value : '', dep ? dep.value : '');
const pos0 = document.querySelector('[data-sec="positions"][data-i="0"]');
if (pos0 && post.value.trim()) pos0.value = post.value;
});

/* Синхронизация метки узла дерева с его полем title (видна в свёрнутом виде) */
document.addEventListener('input', e => {
if (!e.target.matches || !e.target.matches('.mat-node [data-k="title"]')) return;
const card = e.target.closest('.mat-node');
if (!card) return;
const label = card.querySelector(':scope > .mat-node-bar > .mat-node-label');
if (!label) return;
const v = e.target.value.trim();
label.textContent = label.dataset.base + (v ? ': ' + v : '');
});

/* При уходе с поля: материализуем 1-ю строку, если таблицы должностей ещё не было,
или разблокируем строку, если post очищен */
document.addEventListener('change', e => {
const f = e.target.dataset ? e.target.dataset.f : '';
if (f !== 'position' && f !== 'department' && f !== 'post') return;
const post = document.querySelector('[data-f="post"]');
if (!post) return;
const pos0 = document.querySelector('[data-sec="positions"][data-i="0"]');
if (!String(post.value).trim()) { if (pos0) pos0.disabled = false; return; }
if (!pos0) {
const t = data.teachers[cur];
if (!Array.isArray(t.positions)) t.positions = [];
t.positions[0] = String(post.value).trim();
build();
}
});

document.addEventListener('blur', e => {
if (e.target.dataset && e.target.dataset.f === 'name') {
const shortInput = document.querySelector('[data-f="short"]');
if (shortInput && !shortInput.value.trim()) shortInput.value = makeShort(e.target.value);
}
}, true);

if (TOK) load();
</script>
