<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Преподаватель</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2312241f'/><stop offset='1' stop-color='%23d97b29'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23g)'/><text x='50' y='68' font-size='56' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>С</text></svg>">
</head>

<body data-bs-spy="scroll" data-bs-target="#stickyNav" data-bs-offset="120" tabindex="0">
  <div id="progress"></div>
  <div class="sticky-top-wrapper" style="position:sticky;top:0;z-index:1020;background:#fff">
    <header class="hero" style="min-height:250px;overflow:hidden">
      <div class="container-xxl h-100">
        <div class="row g-0 align-items-stretch h-100">
          <div class="col-md-2 col-3 d-flex">
            <div class="hero-photo py-3"><img id="p-photo" src="" alt=""></div>
          </div>
          <div class="col-md-10 col-9 d-flex flex-column align-items-start justify-content-center p-3">
            <span class="mask d-inline-flex flex-row gap-2 align-items-center">
              <span class="kicker" id="p-kicker"></span>
            </span>
            <h1 class="display-font fw-bold mt-1 mb-2" style="font-size:clamp(1.4rem,3vw,2.5rem);line-height:1.15">
              <span class="mask d1"><span id="p-name"></span></span>
            </h1>
            <p class="post" id="p-post"></p>
            <div class="d-flex flex-row justify-content-between align-items-center w-100">
              <div class="d-flex flex-wrap gap-2 mb-1" id="p-chips"></div>
              <div class="d-flex flex-no-wrap justify-content-between align-items-center gap-3">
                <div class="me-0"><a class="chip-link" href="#contact" title="Контакты">
                    <i class="bi bi-telephone fs-4"></i>
                    <i class="bi bi-envelope fs-4"></i>
                    <i class="bi bi-chat fs-4"></i>
                  </a></div>
                <div class="me-0"><a class="btn-share" id="shareBtn" title="Поделиться">
                    <i class="bi bi-share fs-4"></i>
                  </a></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <nav class="sticky-tabs" id="stickyNav">
      <div class="container-xxl">
        <ul class="nav nav-fill" id="menu"></ul>
      </div>
    </nav>
  </div>

  <div class="container-xxl">
    <div class="row g-5">
      <div class="col-lg-9" id="main"></div>
      <aside class="col-lg-3 d-none d-lg-block">
        <div class="rail pt-4 mb-4" id="rail"></div>
      </aside>
    </div>
  </div>

  <footer class="brandbar py-3 mt-0">
    <div class="container-xxl small d-flex justify-content-between flex-wrap">
      <span>© 2026 СПбГМТУ · Управление информационных технологий</span>
      <span id="p-date">Страница обновлена: 17.08.2026</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/teacher.js?v=2"></script>
</body>

</html>
