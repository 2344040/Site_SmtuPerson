  <div class="container py-4" style="max-width:1100px">

      <button class="btn btn-dark" onclick="login()">Войти</button>
      <small class="text-secondary mt-2">Токен хранится только в вашей вкладке браузера и нужен для записи в репозиторий. Оставьте поле токена пустым, чтобы войти в демо-режим: просмотр и правка без публикации.</small>
    </div>
    <div id="app" style="display:none">
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3 admin-toolbar">
        <select id="tsel" class="form-select" style="max-width:420px" onchange="setCur(+this.value)"></select>
        <button class="btn btn-outline-dark btn-sm" onclick="addTeacher()">+ преподаватель</button>
        <button class="btn btn-outline-danger btn-sm" onclick="delTeacher()">Удалить</button>
        <label class="form-check-label small text-secondary d-flex align-items-center gap-1 ms-2 mb-0" title="Карточка исчезнет с главной страницы, личная страница открываться не будет">
          <input class="form-check-input" type="checkbox" id="hideChk" onchange="toggleHidden(this.checked)"> Не выводить
        </label>
        <button class="btn btn-outline-secondary btn-sm ms-2" onclick="syncForLLM()" title="Собрать актуальные файлы из репозитория и положить в буфер обмена для вставки в чат">↻</button>
        <button class="btn btn-success btn-sm ms-auto" onclick="save()">Сохранить и опубликовать</button>
        <span id="status" class="small"></span>
      </div>
      <div id="secs"></div>
    </div>
    <script>
      /* ═══ НАСТРОЙКИ ═══ */
      const OWNER = '2344040', REPO = 'Site_SmtuPerson', PATH = 'data/teachers.json';
      const GATE = '2470';
      /* Демо-режим: вход с пустым полем токена. Данные читаются из опубликованного JSON, правки никуда не отправляются. */
      let DEMO = false;

      /* Файлы для кнопки «↻ файлы для LLM» */
      const LLM_FILES = ['admin.html', 'teacher.html', 'index.html', 'assets/teacher.js', 'assets/style.css'];

      async function fetchFileRaw(p) {
        const headers = { 'Accept': 'application/vnd.github.raw' };
        if (TOK) headers.Authorization = 'Bearer ' + TOK;
        const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + p, { headers });
        if (!r.ok) return null;
        return await r.text();
      }

      async function syncForLLM() {
        const st = document.getElementById('status');
        st.textContent = 'читаю файлы…';
        const parts = [];
        for (const p of LLM_FILES) {
          const txt = await fetchFileRaw(p);
          parts.push(txt === null
            ? `=== файл: ${p} ===\n[НЕ УДАЛОСЬ ПРОЧИТАТЬ — проверьте путь в LLM_FILES]`
            : `=== файл: ${p} ===\n${txt}`);
        }
        const block = parts.join('\n\n');
        try {
          await navigator.clipboard.writeText(block);
          st.innerHTML = `<span class="text-success fw-bold">✔</span> в буфере: ${block.length.toLocaleString('ru-RU')} симв.`;
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = block;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          st.innerHTML = `<span class="text-success fw-bold">✔</span> скопировано (fallback)`;
        }
      }

      /* Миграции данных — общие для боевого и демо-режима */
      function migrate(d) {
        (d.teachers || []).forEach(t => {
          /* Из старого post извлекаем должность для справочника (post не трогаем) */
          if (!t.position && t.post) {
            const m = String(t.post).match(/^(.+?)\s+(?:базовой\s+кафедры|базовой\s+кафедрой|кафедры|кафедрой)\b/i);
            if (m) t.position = m[1].trim();
          }
          /* Легаси-нормализация полей внутри строк books/publications */
          ['books', 'publications'].forEach(k => {
            (t[k] || []).forEach(row => {
              if (row.text && !row.biblio) { row.biblio = row.text; delete row.text; }
              if (row.link && !row.url) { row.url = row.link; delete row.link; }
            });
          });
          /* Сборка единого раздела «Публикации»: целые массивы уходят в новые рубрики.
          Стоит ПОСЛЕ нормализации полей, чтобы переехали уже исправленные строки */
          t.pub_articles = (t.pub_articles || []).concat(t.publications || []);
          delete t.publications;
          if ((t.books || []).length) t.pub_posobia = (t.pub_posobia || []).concat(t.books);
          delete t.books;
          (t.achievements || []).forEach(row => {
            if (row.icon === 'medal') row.icon = 'award-fill';
          });
        });
      }

    </div>
    <textarea id="f-${key}" class="form-control form-control-sm" rows="${rows}" data-f="${key}">${val.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea>
    <div class="small text-secondary mt-1">Можно использовать HTML: &lt;b&gt;, &lt;i&gt;, &lt;ul class='text-block-list'&gt;, &lt;p class='ms-4'&gt;. Ниже — живой предпросмотр.</div>
    <div class="html-preview border rounded p-2 mt-1" id="prev-${key}">${val}</div>
  </div>`;
      }

      // * renderArray
      function renderArray(t, k, noHead) {
        const head = noHead ? '' : `<div class="sec-title">${NAMES[k]}</div>`;
        const arr = Array.isArray(t[k]) ? t[k] : (t[k] = []);
        if (k === 'education') return head + renderEducation(arr);
        const dl = k.startsWith('mat_')
          ? `<datalist id="dl-${k}">${[...new Set(arr.map(r => (r && r.rub) || '').filter(Boolean))]
            .map(v => `<option value="${String(v).replace(/"/g, '&quot;')}"></option>`).join('')}</datalist>`
          : '';
        return head + `<table class="ed" data-sec="${k}">
    <thead><tr>${KEYS[k].map(c => `<th>${colName(k, c)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${arr.map((row, i) => `<tr>${KEYS[k].map(c => {
          const isArrItem = KEYS[k][0] === '*';
          const val = isArrItem ? row : (row[c] || '');
          if (k === 'events' && c === 'now') {
            return `<td><input type="checkbox" data-sec="${k}" data-i="${i}" data-k="${c}" ${val ? 'checked' : ''}></td>`;
          }
          if (k === 'achievements' && c === 'icon') {
            return `<td>
          <span class="icon-prev bi bi-${val || 'award'} me-1"></span>
          <select data-sec="${k}" data-i="${i}" data-k="${c}"
            onchange="this.previousElementSibling.className='icon-prev bi bi-'+(this.value||'award')+' me-1'">
            <option value="" ${!val ? 'selected' : ''}>— авто —</option>
            ${ICONS.map(([v, l]) => `<option value="${v}" ${val === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select></td>`;
          }
          if ((k === 'programs' && c === 'tag') || (k === 'courses' && c === 'b')) {
            return `<td>
    <select data-sec="${k}" data-i="${i}" data-k="${c}">
      ${LEVELS.map(v => `<option value="${v}" ${val === v ? 'selected' : ''}>${v || '—'}</option>`).join('')}
    </select></td>`;
          }
          if (k === 'profiles' && c === 't') {
            const inList = PROFILE_TITLES.includes(val);
            return `<td>
    <select data-sec="${k}" data-i="${i}" data-k="${c}">
      ${!inList && val ? `<option value="${String(val).replace(/"/g, '&quot;')}" selected>${String(val).replace(/</g, '&lt;')}</option>` : ''}
      <option value="" ${!val ? 'selected' : ''}>—</option>
      ${PROFILE_TITLES.map(v => `<option value="${v}" ${val === v ? 'selected' : ''}>${v}</option>`).join('')}
    </select></td>`;
          }
          if (k === 'metrics' && c === 'l') {
            const inList = METRIC_LABELS.includes(val);
            return `<td>
    <select data-sec="${k}" data-i="${i}" data-k="${c}">
      ${!inList && val ? `<option value="${String(val).replace(/"/g, '&quot;')}" selected>${String(val).replace(/</g, '&lt;')}</option>` : ''}
      <option value="" ${!val ? 'selected' : ''}>—</option>
      ${METRIC_LABELS.map(v => `<option value="${v}" ${val === v ? 'selected' : ''}>${v}</option>`).join('')}
    </select></td>`;
          }
          if (k === 'schedule' && (c === 'a' || c === 'b' || c === 'd')) {
            const opts = c === 'a' ? DAYS : c === 'b' ? SLOTS : LESSON_TYPES;
            const inList = opts.includes(val);
            return `<td>
    <select data-sec="${k}" data-i="${i}" data-k="${c}">
      ${!inList && val ? `<option value="${String(val).replace(/"/g, '&quot;')}" selected>${String(val).replace(/</g, '&lt;')}</option>` : ''}
      <option value="" ${!val ? 'selected' : ''}>—</option>
      ${opts.map(v => `<option value="${v}" ${val === v ? 'selected' : ''}>${v}</option>`).join('')}
    </select></td>`;
          }
          if (k.startsWith('mat_') && c === 'rub') {
            return `<td><input list="dl-${k}" data-sec="${k}" data-i="${i}" data-k="${c}" value="${String(val).replace(/"/g, '&quot;')}"></td>`;
          }
          if ((MULTILINE[k] || []).includes(c)) {
            return `<td><textarea rows="${AREA_ROWS[k] || 2}" data-sec="${k}" data-i="${i}" data-k="${c}">${String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea></td>`;
          }
          /* 1-я строка должностей — автоподстановка из «Должность под ФИО» */
          if (k === 'positions' && i === 0 && String(t.post || '').trim()) {
            return `<td><input data-sec="${k}" data-i="${i}" data-k="${c}" value="${String(val).replace(/"/g, '&quot;')}" disabled title="Авто: равно полю «Должность под ФИО»"></td>`;
          }
          return `<td><input data-sec="${k}" data-i="${i}" data-k="${c}" value="${String(val).replace(/"/g, '&quot;')}"></td>`;
        }).join('')}${actCell(k, i)}</tr>`).join('')}</tbody>
  </table>
  <button type="button" class="btn btn-sm btn-outline-dark mt-1 mb-2" onclick="add('${k}')">+ строка</button>${dl}`;
      }

      // * actCell
      function actCell(k, i) {
        if (k === 'positions' && i === 0 && String(data.teachers[cur].post || '').trim()) {
          return `<td class="td-act"><span class="small text-secondary" title="Строка подставляется автоматически из поля «Должность под ФИО»">авто</span></td>`;
        }
        const withArrows = k.startsWith('mat_') || k.startsWith('pub_') || k === 'metrics';
        return withArrows
          ? `<td class="td-act">
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="move('${k}',${i},-1)" title="Выше">↑</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="move('${k}',${i},1)" title="Ниже">↓</button>
              <button type="button" class="btn btn-sm btn-outline-danger" onclick="rm('${k}',${i})" title="Удалить">✕</button>
            </td>`
          : `<td><button type="button" class="btn btn-sm btn-outline-danger" onclick="rm('${k}',${i})">✕</button></td>`;
      }

      // * move
      function move(k, i, dir) {
        collect();
        const arr = data.teachers[cur][k];
        const j = i + dir;
        if (j < 0 || j >= arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]];
        build();
      }

      // * build
      function build() {
        const t = data.teachers[cur];
        const openState = {};
        document.querySelectorAll('#secs details[data-g]').forEach(d => {
          openState[d.dataset.g] = d.open;
        });
        document.getElementById('secs').innerHTML = GROUPS.map((g, gi) => {
          let inner = '', rowBuf = null;
          const flush = () => { if (rowBuf !== null) { inner += '<div class="row g-2">' + rowBuf + '</div>'; rowBuf = null; } };
          g.items.forEach(([type, key, opt]) => {
            if (type === 's') {
              const [label, w] = SCALAR[key];
              const v = t[key] || DEFAULTS[key] || '';
              let ctrl;
              if (key === 'faculty') {
                const opts = (v && !FACULTIES.includes(v)) ? [v, ...FACULTIES] : FACULTIES;
                ctrl = `<select class="form-select form-select-sm" data-f="${key}" onchange="collect(); build()">
                  <option value="" ${!v ? 'selected' : ''}>—</option>
                  ${opts.map(f => `<option value="${f.replace(/"/g, '&quot;')}" ${v === f ? 'selected' : ''}>${f}</option>`).join('')}
                </select>`;
              } else if (key === 'department') {
                const deps = DEPARTMENTS[t.faculty] || [];
                const opts = (v && !deps.includes(v)) ? [v, ...deps] : deps;
                ctrl = `<select class="form-select form-select-sm" data-f="${key}">
                  <option value="" ${!v ? 'selected' : ''}>—</option>
                  ${opts.map(f => `<option value="${f.replace(/"/g, '&quot;')}" ${v === f ? 'selected' : ''}>${f}</option>`).join('')}
                </select>`;
              } else if (key === 'position') {
                ctrl = `<input class="form-control form-control-sm" data-f="${key}" list="dl-position" value="${String(v).replace(/"/g, '&quot;')}">
                <datalist id="dl-position">${positionOptions().map(p => `<option value="${String(p).replace(/"/g, '&quot;')}"></option>`).join('')}</datalist>`;
              } else {
                ctrl = `<input class="form-control form-control-sm" data-f="${key}" value="${String(v).replace(/"/g, '&quot;')}">`;
              }
              rowBuf = (rowBuf || '') + `<div class="${w}"><label class="small text-secondary">${label}</label>${ctrl}</div>`;
            } else if (type === 't') {
              const [label, rows] = TEXTS[key];
              rowBuf = (rowBuf || '') + `<div class="col-12"><label class="small text-secondary">${label}</label>
          <textarea class="form-control form-control-sm" rows="${rows}" data-f="${key}">${(t[key] || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea></div>`;
            } else {
              flush();
              if (type === 'H') inner += `<div class="fw-semibold small mt-3 mb-1" style="color:#2f6f63">${NAMES[key]}</div>`;
              else if (type === 'a') inner += renderArray(t, key, opt);
              else if (type === 'h') inner += renderHtmlField(t, key);
              else if (type === 'x') inner += `<div class="mt-4 mb-1">
  <label class="small fw-semibold" style="color:#2f6f63">Ссылка на полное расписание (внешний URL)</label>
   <input class="form-control form-control-sm" data-ext="${key}" placeholder="https://..." value="${(t.external_links?.[key] || '').replace(/"/g, '&quot;')}">
</div>`;
            }
          });
          flush();
          const isOpen = (openState[gi] !== undefined) ? openState[gi] : !!g.open;
          return `<details class="card p-2 mb-2" data-g="${gi}" ${isOpen ? 'open' : ''}>
      <summary class="fw-bold">${g.title}</summary>
      <div class="mt-2">${inner}</div>
    </details>`;
        }).join('');

        /* Автогенерация: должность есть, post пуст — заполняем */
        const pi = document.querySelector('[data-f="position"]');
        const po = document.querySelector('[data-f="post"]');
        if (pi && po && pi.value.trim() && !po.value.trim()) {
          po.value = composePost(pi.value, document.querySelector('[data-f="department"]')?.value || '');
        }
        /* 1-я строка должностей равна текущему post (если post заполнен) */
        const pos0 = document.querySelector('[data-sec="positions"][data-i="0"]');
        if (po && pos0 && po.value.trim()) pos0.value = po.value;

        const hc = document.getElementById('hideChk');
        if (hc) hc.checked = !!data.teachers[cur].hidden;
      }

      /* ═══ Сбор данных из формы ═══ */
      function collect() {
        const t = data.teachers[cur];
        document.querySelectorAll('[data-f]').forEach(i => t[i.dataset.f] = i.value);
        /* Основная должность зеркалит поле «Должность под ФИО» (если оно заполнено) */
        const postVal = String(t.post || '').trim();
        if (postVal) {
          if (!Array.isArray(t.positions)) t.positions = [];
          t.positions[0] = postVal;
        }
        if (!String(t.short || '').trim()) t.short = makeShort(t.name);
        if (!t.external_links) t.external_links = {};
        document.querySelectorAll('[data-ext]').forEach(i => t.external_links[i.dataset.ext] = i.value);
        Object.keys(KEYS).forEach(k => { t[k] = []; });
        document.querySelectorAll('[data-sec][data-i][data-k]').forEach(i => {
          const sec = i.dataset.sec, idx = +i.dataset.i, k = i.dataset.k;
          const row = (t[sec][idx] = t[sec][idx] || (KEYS[sec][0] === '*' ? '' : {}));
          if (KEYS[sec][0] === '*') t[sec][idx] = i.value;
          else row[k] = i.type === 'checkbox' ? i.checked : i.value;
        });
      }

      // * add(k)
      function add(k) {
        collect();
        const t = data.teachers[cur];
        const prevRow = t[k] && t[k].length ? t[k][t[k].length - 1] : null;
        const fresh = KEYS[k][0] === '*' ? '' : Object.fromEntries(KEYS[k].map(c => [c, '']));
        if (k.startsWith('mat_') && prevRow && prevRow.rub) fresh.rub = prevRow.rub;
        t[k].push(fresh);
        build();
        const newRow = document.querySelector(`[data-sec="${k}"][data-i="${t[k].length - 1}"]`);
        if (newRow) {
          newRow.closest('tr').scrollIntoView({ behavior: 'smooth', block: 'center' });
          if (newRow.focus) newRow.focus({ preventScroll: true });
        }
      }

      function rm(k, i) {
        collect();
        data.teachers[cur][k].splice(i, 1);
        build();
      }

      function addTeacher() {
        collect();
        data.teachers.push({
          id: 'new' + Date.now(), name: 'Новый преподаватель',
          chips: [], positions: [], education: [], career: [], news: [],
          university: 'СПбГМТУ'
        });
        cur = data.teachers.length - 1;
        rememberCur();
        buildSel(); build();
      }

      function delTeacher() {
        if (!confirm('Удалить преподавателя?')) return;
        collect();
        data.teachers.splice(cur, 1);
        cur = Math.max(0, Math.min(cur, data.teachers.length - 1));
        rememberCur();
        buildSel(); build();
      }

      // * save
      /* ═══ Сохранение в GitHub ═══ */
      async function save() {
        collect();
        const st = document.getElementById('status');
        if (DEMO) {
          st.innerHTML = '<span class="text-warning fw-bold">ДЕМО: правки не отправлены в GitHub</span>';
          alert('Демо-режим: изменения остаются только в этой вкладке браузера.');
          return;
        }
        st.textContent = 'сохраняю…';
        try {
          const g = await gh('/contents/' + PATH);
          if (!g.ok) {
            const e = await g.json().catch(() => ({}));
            alert('Не удалось прочитать файл:\nGET ' + g.status + '\n' + (e.message || ''));
            st.textContent = '✗ GET ' + g.status; return;
          }
          const curFile = await g.json();
          const json = JSON.stringify(data, null, 1);
          const b64 = btoa(unescape(encodeURIComponent(json)));
          const r = await gh('/contents/' + PATH, {
            method: 'PUT',
            body: JSON.stringify({
              message: 'admin: update ' + new Date().toISOString(),
              content: b64, sha: curFile.sha
            })
          });
          const res = await r.json().catch(() => ({}));
          if (r.ok) {
            const stamp = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            st.innerHTML = `<span class="text-success fw-bold">✔</span> ${stamp}`;
          } else {
            st.innerHTML = `<span class="text-danger fw-bold">✗</span> ${r.status}`;
            alert('Ошибка ' + r.status + '\n' + (res.message || JSON.stringify(res)));
          }
        } catch (err) { st.textContent = '✗ сбой скрипта'; alert('Исключение: ' + err); }
      }

      // * wrapSel
      function wrapSel(ta, before, after) {
        const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
        ta.value = v.slice(0, s) + before + v.slice(s, e) + after + v.slice(e);
        ta.focus();
        ta.selectionStart = s + before.length;
        ta.selectionEnd = e + before.length;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }

      // * listSel
      function listSel(ta, tag) {
        const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
        const lines = v.slice(s, e).split(/\r?\n/).map(l => l.replace(/^[-•*\d.)\s]+/, '').trim()).filter(Boolean);
        const items = (lines.length ? lines : ['']).map(l => '  <li>' + l + '</li>').join('\n');
        const insert = tag === 'li'
          ? items
          : '<' + tag + (tag === 'ul' ? " class='text-block-list'" : '') + '>\n' + items + '\n</' + tag + '>';
        ta.value = v.slice(0, s) + insert + v.slice(e);
        ta.focus();
        ta.selectionStart = ta.selectionEnd = s + insert.length;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }

      document.addEventListener('click', e => {
        const b = e.target.closest('.html-tools button');
        if (!b) return;
        const ta = document.getElementById(b.closest('.html-tools').dataset.target);
        if (!ta) return;
        if (b.dataset.list) { listSel(ta, b.dataset.list); return; }
        const [before, after] = b.dataset.wrap.split('|');
        wrapSel(ta, before, after);
      });

      document.addEventListener('input', e => {
        const f = e.target.dataset ? e.target.dataset.f : '';
        const prev = f ? document.getElementById('prev-' + f) : null;
        if (prev) prev.innerHTML = e.target.value;
      });

      /* Регенерация «Должность под ФИО» + зеркало в 1-ю строку должностей */
      document.addEventListener('input', e => {
        const f = e.target.dataset ? e.target.dataset.f : '';
        if (f !== 'position' && f !== 'department' && f !== 'post') return;
        const pos = document.querySelector('[data-f="position"]');
        const dep = document.querySelector('[data-f="department"]');
        const post = document.querySelector('[data-f="post"]');
        if (!post) return;
        if (f !== 'post') post.value = composePost(pos ? pos.value : '', dep ? dep.value : '');
        const pos0 = document.querySelector('[data-sec="positions"][data-i="0"]');
        if (pos0 && post.value.trim()) pos0.value = post.value;
      });
      /* При уходе с поля: материализуем 1-ю строку, если таблицы должностей ещё не было,
         или разблокируем строку, если post очищен */
      document.addEventListener('change', e => {
        const f = e.target.dataset ? e.target.dataset.f : '';
        if (f !== 'position' && f !== 'department' && f !== 'post') return;
        const post = document.querySelector('[data-f="post"]');
        if (!post) return;
        const pos0 = document.querySelector('[data-sec="positions"][data-i="0"]');
        if (!String(post.value).trim()) { if (pos0) pos0.disabled = false; return; }
        if (!pos0) {
          const t = data.teachers[cur];
          if (!Array.isArray(t.positions)) t.positions = [];
          t.positions[0] = String(post.value).trim();
          build();
        }
      });

      document.addEventListener('blur', e => {
        if (e.target.dataset && e.target.dataset.f === 'name') {
          const shortInput = document.querySelector('[data-f="short"]');
          if (shortInput && !shortInput.value.trim()) shortInput.value = makeShort(e.target.value);
        }
      }, true);

      if (TOK) load();
    </script>
  </div>
</body>

</html>
