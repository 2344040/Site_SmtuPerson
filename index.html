<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Преподаватели — СПбГМТУ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2312241f'/><stop offset='1' stop-color='%23d97b29'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23g)'/><text x='50' y='68' font-size='56' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>С</text></svg>">
<style>
.tcard{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  text-decoration:none;color:var(--ink);height:100%;transition:.25s;}
.tcard:hover{transform:translateY(-6px);box-shadow:0 18px 34px -20px rgba(18,36,31,.5);color:var(--ink);}
.tcard img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center top;}
.tcard h3{font-size:1rem;padding:.8rem .9rem 0;}
.tcard p{color:var(--muted);font-size:.8rem;padding:0 .9rem .9rem;margin:0;}
</style></head>
<body>
<div class="container-xl py-4">
  <h1 class="sec-title">Преподаватели кафедры</h1><div class="rule"></div>
  <div id="cards" class="row g-4"></div>
</div>
<script>
fetch('data/teachers.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('cards').innerHTML = d.teachers.map(t=>`
    <div class="col-md-4"><a class="tcard" href="teacher.html?id=${t.id}">
      <img src="${t.photo}" alt=""><h3>${t.name}</h3><p>${t.post}</p>
      <div class="px-3 pb-3"><span class="chip"><b>${t.chips[0]||''}</b></span></div>
    </a></div>`).join('');
});
</script>
</body></html>
