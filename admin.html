        /* & Карьера: год ≈14 знаков, учреждение и должность поровну ── */

</head>

<body>
  <div class="container py-4" style="max-width:1100px">

    <div id="login" class="card p-4 mx-auto" style="max-width:420px">
      <h5>Вход в админку</h5>
      <input id="gate" type="password" class="form-control mb-2" placeholder="Локальный пароль (если задан)">
      <input id="token" type="password" class="form-control mb-2" placeholder="GitHub Personal Access Token">
      <button class="btn btn-dark" onclick="login()">Войти</button>
      <small class="text-secondary mt-2">Токен хранится только в вашей вкладке браузера и нужен для записи в репозиторий.</small>
    </div>

    <div id="app" style="display:none">
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <select id="tsel" class="form-select" style="max-width:320px" onchange="cur=+this.value;build()"></select>
        <button class="btn btn-outline-dark btn-sm" onclick="addTeacher()">+ преподаватель</button>
        <button class="btn btn-outline-danger btn-sm" onclick="delTeacher()">Удалить</button>
        <button class="btn btn-success btn-sm ms-auto" onclick="save()">Сохранить и опубликовать</button>

        <h6>Личные данные</h6>

    <script>
      /* ═══ НАСТРОЙКИ — ВПИШИТЕ СВОИ OWNER И REPO! ═══ */
      const OWNER = '2344040', REPO = 'Site_SmtuPerson', PATH = 'data/teachers.json';
      const GATE = '';

      // * SCALAR
      /* ═══ Личные данные: [ключ, подпись, ширина] ═══ */
      /* Скалярные поля: ключ → [подпись, ширина] */

        id: ['ID (латиницей)', 'col-md-3'],
        short: ['ФИО коротко', 'col-md-3'],
        photo: ['URL фото', 'col-md-12'],
        university: ['Университет (кратко)', 'col-md-6'],
        faculty: ['Факультет', 'col-md-6'],

        share_tg_url: ['URL для Telegram share', 'col-md-6'],
        share_vk_url: ['URL для VK share', 'col-md-6']
      };

      /* Короткое ФИО из полного: «Иванов Иван Иванович» → «Иванов И.И.» */
      const makeShort = name => {
        const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return '';
        const initials = parts.slice(1).map(w => w[0].toUpperCase() + '.').join('');
        return initials ? parts[0] + ' ' + initials : parts[0];
      };

      // * TEXTS
      /* Многострочные скалярные поля: ключ → [подпись, строк] */

        ped_text: ['Текстовый блок педагогической деятельности (опционально)', 6],
        science_text: ['Текстовый блок научных интересов', 3],

      /* ═══ БЛОКИ АДМИНКИ = СЕКЦИИ ЦЕЛЕВОЙ СТРАНИЦЫ ═══
         s = скалярное поле, t = textarea, a = таблица-массив, x = внешняя ссылка */

      const GROUPS = [
        { title: '0. Служебное', open: true, items: [['s', 'id'], ['s', 'name'], ['s', 'short']] },

        { title: '5. Карьера', items: [['a', 'career'], ['H', 'achievements'], ['h', 'ach_text'], ['a', 'achievements']] },
        {

          items: [['h', 'ped_text'], ['a', 'programs'], ['a', 'courses'], ['a', 'schedule'], ['x', 'schedule'], ['a', 'session'], ['a', 'books']]
        },
        {
          title: '7. Научная деятельность',
          items: [['a', 'metrics'], ['h', 'science_text'], ['a', 'publications'], ['a', 'projects'], ['a', 'patents']]
        },
        { title: '8. Общественная деятельность', items: [['h', 'social_text'], ['a', 'social']] },
        { title: '9. Правый сайдбар', items: [['a', 'events'], ['a', 'rail_edu'], ['a', 'profiles']] },
        { title: '10. Учебные материалы', items: [['a', 'mat_posobia'], ['a', 'mat_books'], ['a', 'mat_lectures'], ['a', 'mat_video'], ['a', 'mat_resources']] }
      ];

      // * KEYS
      const KEYS = {
        chips: ['*'], positions: ['*'],
        // education: ['year', 'title', 'text'], 
        education: ['year', 'institution', 'level', 'profile', 'qualification'],
        upk: ['year', 'title', 'text'],
        career: ['year', 'title', 'text'],
        achievements: ['year', 'icon', 'title', 'text'],
        programs: ['text', 'title', 'tag', 'comment'],
        courses: ['a', 'b', 'c', 'd', 'e'],
        schedule: ['a', 'b', 'c', 'd', 'e', 'f'],
        session: ['a', 'b', 'c', 'd', 'e', 'f'],
        books: ['year', 'title', 'text', 'tag'],
        publications: ['year', 'title', 'text', 'tag', 'link', 'doi'],
        patents: ['year', 'title', 'text', 'tag'],
        projects: ['year', 'title', 'text'],
        social: ['title', 'text'],
        metrics: ['n', 'l'],
        events: ['time', 'subject', 'type', 'building', 'room', 'now'],
        profiles: ['t', 'u'],
        news: ['date', 'title', 'img', 'url'],
        rail_edu: ['t', 'u'],
        mat_posobia: ['author', 'title', 'url', 'rub'],
        mat_books: ['author', 'title', 'biblio', 'url', 'url_buy', 'rub'],
        mat_lectures: ['author', 'title', 'url', 'rub'],
        mat_video: ['author', 'title', 'url', 'rub'],
        mat_resources: ['title', 'url', 'rub'],
      };

      /* Иконки достижений: [значение в JSON, подпись в списке] */
      const ICONS = [
        ['award', '🎖 award — медаль / лента'],
        ['trophy', '🏆 trophy — кубок'],
        ['medal', '🥇 medal — медаль'],
        ['star', '⭐ star — звезда'],
        ['patch-check', '✅ patch-check — знак отличия'],
        ['mortarboard', '🎓 mortarboard — академическая шапка'],
        ['gem', '💎 gem — драгоценный камень'],
        ['bookmark-star', '🔖 bookmark-star — закладка со звездой']
      ];

      // * NAMES 
      const NAMES = {
        chips: 'Чипсы', positions: 'Должности (верхний блок)',
        education: 'Образование', upk: 'Повышение квалификации',
        career: 'Карьера', achievements: 'Профессиональные достижения',
        programs: 'Программы', courses: 'Дисциплины', schedule: 'Расписание', session: 'Сессия',
        books: 'Пособия', publications: 'Публикации', patents: 'Патенты', projects: 'Проекты',
        social: 'Общественная деятельность', metrics: 'Метрики науки', events: 'События (правый сайдбар)',
        profiles: 'Профили (правый сайдбар)', news: 'Новости',
        rail_edu: 'Учебный процесс (ссылки правого сайдбара)',
        mat_posobia: 'Учебные пособия', mat_books: 'Книги', mat_lectures: 'Записи лекций',
        mat_video: 'Видео-материалы', mat_resources: 'Полезные ресурсы',
      };

      // * MULTILINE
      const MULTILINE = {
        achievements: ['text'], publications: ['text'], patents: ['text'],
        projects: ['text'], social: ['text'], news: ['title']
      };
      const AREA_ROWS = { achievements: 4, publications: 3 };

      // * COL_NAMES
      const COL_NAMES = {
        '*': 'Значение', year: 'Год', date: 'Дата', title: 'Название', text: 'Описание',
        tag: 'Тег', icon: 'Иконка', link: 'Ссылка', doi: 'DOI',
        n: 'Число', l: 'Подпись', t: 'Заголовок', x: 'Описание', now: 'Сейчас', u: 'URL', img: 'URL картинки',
        institution: 'Учреждение', level: 'Уровень', profile: 'Профиль', qualification: 'Квалификация',
        time: 'Время', subject: 'Предмет', type: 'Тип занятия',
        building: 'Корпус', room: 'Аудитория',
        /* Учебные материалы */
        author: 'Автор', url: 'Ссылка / файл', url_buy: 'Ссылка на покупку', rub: 'Рубрика (через /)', biblio: 'Выходные данные',
      };

      const LEVELS = ['', 'бакалавриат', 'специалитет', 'магистратура', 'базовое высшее', 'специализированное высшее', 'аспирантура', 'докторантура', 'СПО', 'ДПО'];


      // * SEC_COLS
      const SEC_COLS = {
        courses: { a: 'Дисциплина', b: 'Уровень', c: 'Курс', d: 'Семестр', e: 'Часы' },
        schedule: { a: 'День', b: 'Время', c: 'Дисциплина', d: 'Тип', e: 'Группа', f: 'Ауд.' },
        session: { a: 'Дата', b: 'Время', c: 'Дисциплина', d: 'Форма', e: 'Группа', f: 'Ауд.' },
        programs: { text: 'Код ОП', title: 'Название', tag: 'Уровень', comment: 'Комментарий' },
        career: { title: 'Организация', text: 'Должность' },


      };
      function colName(sec, key) {
        return (SEC_COLS[sec] && SEC_COLS[sec][key]) || COL_NAMES[key] || key;
      }

      /* ═══ Состояние и GitHub API ═══ */
      let TOK = sessionStorage.tok || '', data = null, cur = 0;
      const gh = (u, o) => fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + u,
        { ...o, headers: { Authorization: 'Bearer ' + TOK, 'Content-Type': 'application/json' } });

      /* ═══ Вход и загрузка ═══ */
      function login() {
        if (GATE && document.getElementById('gate').value !== GATE) return alert('Неверный пароль');
        TOK = document.getElementById('token').value.trim();
        sessionStorage.tok = TOK;
        load();
      }
      async function load() {
        const r = await gh('/contents/' + PATH);
        if (!r.ok) return alert('Токен не принят: ' + r.status);
        data = JSON.parse(decodeURIComponent(escape(atob((await r.json()).content))));
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = '';
        buildSel(); build();
      }
      function buildSel() {
        const s = document.getElementById('tsel');
        s.innerHTML = data.teachers.map((t, i) => `<option value="${i}">${t.short || makeShort(t.name) || t.name || t.id}</option>`).join('');
        s.value = cur;
      }

      /* Список ранее вводившихся учреждений — по всем преподавателям, по алфавиту */
      const institutionOptions = () => {
        const vals = new Set();
        (data.teachers || []).forEach(t => (t.education || []).forEach(r => {
          const v = String((r && r.institution) || '').trim();
          if (v) vals.add(v);
        }));
        return [...vals].sort((a, b) => a.localeCompare(b, 'ru'));
      };

      /* ═══ Рендер формы ═══ */
      function renderEducation(arr) {
        const dl = `<datalist id="dl-institution">${institutionOptions()
          .map(v => `<option value="${String(v).replace(/"/g, '&quot;')}"></option>`).join('')}</datalist>`;
        return arr.map((row, i) => `
    <div class="ed-rec">
      <div class="d-flex justify-content-between align-items-center">
        <span class="small fw-semibold" style="color:#2f6f63">Запись ${i + 1}</span>
        <button class="btn btn-sm btn-outline-danger" onclick="rm('education',${i})">✕ удалить</button>
      </div>
      <div class="row g-2 mt-1">
        <div class="col-md-2"><label class="small text-secondary">Год</label>
          <input class="form-control form-control-sm" data-sec="education" data-i="${i}" data-k="year"
                 value="${(row.year || '').replace(/"/g, '&quot;')}"></div>
        <div class="col-md-4"><label class="small text-secondary">Учреждение</label>
          <input class="form-control form-control-sm" list="dl-institution" data-sec="education" data-i="${i}" data-k="institution"
                 value="${(row.institution || '').replace(/"/g, '&quot;')}"></div>
        <div class="col-md-3"><label class="small text-secondary">Уровень</label>
          <select class="form-select form-select-sm" data-sec="education" data-i="${i}" data-k="level">
            ${LEVELS.map(v => `<option value="${v}" ${row.level === v ? 'selected' : ''}>${v || '—'}</option>`).join('')}
          </select></div>
        <div class="col-md-6"><label class="small text-secondary">Профиль</label>
          <input class="form-control form-control-sm" data-sec="education" data-i="${i}" data-k="profile"
                 value="${(row.profile || '').replace(/"/g, '&quot;')}"></div>
        <div class="col-md-6"><label class="small text-secondary">Квалификация</label>
          <input class="form-control form-control-sm" data-sec="education" data-i="${i}" data-k="qualification"
                 value="${(row.qualification || '').replace(/"/g, '&quot;')}"></div>
      </div>
    </div>`).join('') +
          `<button class="btn btn-sm btn-outline-dark mt-2 mb-1" onclick="add('education')">+ строка</button>` + dl;
      }

      //  * renderHtmlField()
      function renderHtmlField(t, key) {
        const [label, rows] = TEXTS[key];
        const val = t[key] || '';
        return `<div class="mt-3 mb-1">
    
    <label class="sec-title">${label}</label>
   <div class="d-flex gap-1 mb-1 html-tools" data-target="f-${key}">
      <button type="button" class="btn btn-sm btn-outline-secondary" data-wrap="<b>|</b>" title="Жирный"><b>Ж</b></button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-wrap="<i>|</i>" title="Курсив"><i>К</i></button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-list="ul" title="Маркированный список: разбивает выделение по строкам на li">• список</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-list="ol" title="Нумерованный список: разбивает выделение по строкам на li">1. список</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-list="li" title="Обернуть каждую выделенную строку в <li> без контейнера">li пункт</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-wrap="<p class='ms-4'>|</p>" title="Отступ">⇥ отступ</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-wrap="<p>|</p>" title="Абзац">¶ абзац</button>
    </div>
    <textarea id="f-${key}" class="form-control form-control-sm" rows="${rows}" data-f="${key}">${val.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea>
    <div class="small text-secondary mt-1">Можно использовать HTML: &lt;b&gt;, &lt;i&gt;, &lt;ul class='text-block-list'&gt;, &lt;p class='ms-4'&gt;. Ниже — живой предпросмотр.</div>
    <div class="html-preview border rounded p-2 mt-1" id="prev-${key}">${val}</div>
  </div>`;
      }

      // * renderArray
      function renderArray(t, k, noHead) {
        const head = noHead ? '' : `<div class="sec-title">${NAMES[k]}</div>`;
        const arr = Array.isArray(t[k]) ? t[k] : (t[k] = []);

        /* Образование — карточки-записи вместо таблицы */
        if (k === 'education') return head + renderEducation(arr);

        /* Datalist для рубрик материалов */
        const dl = k.startsWith('mat_')
          ? `<datalist id="dl-${k}">${[...new Set(arr.map(r => (r && r.rub) || '').filter(Boolean))]
            .map(v => `<option value="${String(v).replace(/"/g, '&quot;')}"></option>`).join('')}</datalist>`
          : '';

        /* Остальные секции — прежняя таблица */
        return head + `<table class="ed" data-sec="${k}">
    <thead><tr>${KEYS[k].map(c => `<th>${colName(k, c)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${arr.map((row, i) => `<tr>${KEYS[k].map(c => {
          const isArrItem = KEYS[k][0] === '*';
          const val = isArrItem ? row : (row[c] || '');
          if (k === 'events' && c === 'now') {
            return `<td><input type="checkbox" data-sec="${k}" data-i="${i}" data-k="${c}" ${val ? 'checked' : ''}></td>`;
          }
          if (k === 'achievements' && c === 'icon') {
            return `<td>
          <span class="icon-prev bi bi-${val || 'award'} me-1"></span>
          <select data-sec="${k}" data-i="${i}" data-k="${c}"
            onchange="this.previousElementSibling.className='icon-prev bi bi-'+(this.value||'award')+' me-1'">
            <option value="" ${!val ? 'selected' : ''}>— авто —</option>
            ${ICONS.map(([v, l]) => `<option value="${v}" ${val === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select></td>`;
          }

          if ((k === 'programs' && c === 'tag') || (k === 'courses' && c === 'b')) {
            return `<td>
    <select data-sec="${k}" data-i="${i}" data-k="${c}">
      ${LEVELS.map(v => `<option value="${v}" ${val === v ? 'selected' : ''}>${v || '—'}</option>`).join('')}
    </select></td>`;
          }

          if (k.startsWith('mat_') && c === 'rub') {
            return `<td><input list="dl-${k}" data-sec="${k}" data-i="${i}" data-k="${c}" value="${String(val).replace(/"/g, '&quot;')}"></td>`;
          }

          if ((MULTILINE[k] || []).includes(c)) {
            return `<td><textarea rows="${AREA_ROWS[k] || 2}" data-sec="${k}" data-i="${i}" data-k="${c}">${String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea></td>`;
          }
          return `<td><input data-sec="${k}" data-i="${i}" data-k="${c}" value="${String(val).replace(/"/g, '&quot;')}"></td>`;
        }).join('')}${actCell(k, i)}</tr>`).join('')}</tbody>
  </table>
  <button type="button" class="btn btn-sm btn-outline-dark mt-1 mb-2" onclick="add('${k}')">+ строка</button>${dl}`;
      }

      // * actCell
      /* Стрелки перемещения + удаление (для материалов — со стрелками) */
      function actCell(k, i) {
        return k.startsWith('mat_')
          ? `<td class="td-act">
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="move('${k}',${i},-1)" title="Выше">↑</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="move('${k}',${i},1)" title="Ниже">↓</button>
              <button type="button" class="btn btn-sm btn-outline-danger" onclick="rm('${k}',${i})" title="Удалить">✕</button>
            </td>`
          : `<td><button type="button" class="btn btn-sm btn-outline-danger" onclick="rm('${k}',${i})">✕</button></td>`;
      }

      // * move
      function move(k, i, dir) {
        collect();
        const arr = data.teachers[cur][k];
        const j = i + dir;
        if (j < 0 || j >= arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]];
        build();
      }

      // * build
      function build() {
        const t = data.teachers[cur];

        /* запоминаем, какие блоки были раскрыты до перерисовки */
        const openState = {};
        document.querySelectorAll('#secs details[data-g]').forEach(d => {
          openState[d.dataset.g] = d.open;
        });

        /* старая карточка «Личные данные» больше не нужна — прячем её */
        // const pf = document.getElementById('pf');
        // if (pf) pf.closest('.card').style.display = 'none';

        document.getElementById('secs').innerHTML = GROUPS.map((g, gi) => {
          let inner = '', rowBuf = null;
          const flush = () => { if (rowBuf !== null) { inner += '<div class="row g-2">' + rowBuf + '</div>'; rowBuf = null; } };

          g.items.forEach(([type, key, opt]) => {
            if (type === 's') {
              const [label, w] = SCALAR[key];
              rowBuf = (rowBuf || '') + `<div class="${w}"><label class="small text-secondary">${label}</label>
          <input class="form-control form-control-sm" data-f="${key}"
                 value="${(t[key] || '').replace(/"/g, '&quot;')}"></div>`;
            } else if (type === 't') {
              const [label, rows] = TEXTS[key];
              rowBuf = (rowBuf || '') + `<div class="col-12"><label class="small text-secondary">${label}</label>
          <textarea class="form-control form-control-sm" rows="${rows}" data-f="${key}">${(t[key] || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea></div>`;
            } else {
              flush();
              if (type === 'H') inner += `<div class="fw-semibold small mt-3 mb-1" style="color:#2f6f63">${NAMES[key]}</div>`;
              else if (type === 'a') inner += renderArray(t, key, opt);
              else if (type === 'h') inner += renderHtmlField(t, key);
              else if (type === 'x') inner += `<div class="mt-4 mb-1">
  <label class="small fw-semibold" style="color:#2f6f63">Ссылка на полное расписание (внешний URL)</label>
   <input class="form-control form-control-sm" data-ext="${key}" placeholder="https://..." value="${(t.external_links?.[key] || '').replace(/"/g, '&quot;')}">
</div>`;
            }
          });
          flush();

          const isOpen = (openState[gi] !== undefined) ? openState[gi] : !!g.open;
          return `<details class="card p-2 mb-2" data-g="${gi}" ${isOpen ? 'open' : ''}>
      <summary class="fw-bold">${g.title}</summary>
      <div class="mt-2">${inner}</div>
    </details>`;
        }).join('');
      }
      /* ═══ Сбор данных из формы ═══ */
      function collect() {
        const t = data.teachers[cur];
        document.querySelectorAll('[data-f]').forEach(i => t[i.dataset.f] = i.value);
        if (!String(t.short || '').trim()) t.short = makeShort(t.name);
        if (!t.external_links) t.external_links = {};
        document.querySelectorAll('[data-ext]').forEach(i => t.external_links[i.dataset.ext] = i.value);
        Object.keys(KEYS).forEach(k => { t[k] = []; });
        document.querySelectorAll('[data-sec][data-i][data-k]').forEach(i => {
          const sec = i.dataset.sec, idx = +i.dataset.i, k = i.dataset.k;
          const row = (t[sec][idx] = t[sec][idx] || (KEYS[sec][0] === '*' ? '' : {}));
          if (KEYS[sec][0] === '*') t[sec][idx] = i.value;
          else row[k] = i.type === 'checkbox' ? i.checked : i.value;
        });
      }

      // * add(k)
      function add(k) {
        collect();
        const t = data.teachers[cur];
        const prevRow = t[k] && t[k].length ? t[k][t[k].length - 1] : null;
        const fresh = KEYS[k][0] === '*' ? '' : Object.fromEntries(KEYS[k].map(c => [c, '']));
        if (k.startsWith('mat_') && prevRow && prevRow.rub) fresh.rub = prevRow.rub;
        t[k].push(fresh);
        build();

        /* возвращаем редактора к только что созданной строке */
        const newRow = document.querySelector(`[data-sec="${k}"][data-i="${t[k].length - 1}"]`);
        if (newRow) {
          newRow.closest('tr').scrollIntoView({ behavior: 'smooth', block: 'center' });
          if (newRow.focus) newRow.focus({ preventScroll: true });
        }
      }

      function rm(k, i) {
        collect();
        data.teachers[cur][k].splice(i, 1);
        build();
      }
      function addTeacher() {
        collect();
        data.teachers.push({
          id: 'new' + Date.now(), name: 'Новый преподаватель',
          chips: [], positions: [], education: [], career: [], news: []
        });
        cur = data.teachers.length - 1;
        buildSel(); build();
      }
      function delTeacher() {
        if (!confirm('Удалить преподавателя?')) return;
        collect();
        data.teachers.splice(cur, 1);
        cur = 0;
        buildSel(); build();
      }

      /* ═══ Сохранение в GitHub ═══ */
      async function save() {
        collect();
        const st = document.getElementById('status');
        st.textContent = 'v3: сохраняю…';
        try {
          const g = await gh('/contents/' + PATH);
          if (!g.ok) {
            const e = await g.json().catch(() => ({}));
            alert('Не удалось прочитать файл:\nGET ' + g.status + '\n' + (e.message || ''));
            st.textContent = '✗ GET ' + g.status; return;
          }
          const curFile = await g.json();
          const json = JSON.stringify(data, null, 1);
          const b64 = btoa(unescape(encodeURIComponent(json)));
          const r = await gh('/contents/' + PATH, {
            method: 'PUT',
            body: JSON.stringify({
              message: 'admin: update ' + new Date().toISOString(),
              content: b64, sha: curFile.sha
            })
          });
          const res = await r.json().catch(() => ({}));
          if (r.ok) st.textContent = '✔ опубликовано (Pages обновится за ~1 мин)';
          else { st.textContent = '✗ ' + r.status; alert('Ошибка ' + r.status + '\n' + (res.message || JSON.stringify(res))); }
        } catch (err) { st.textContent = '✗ сбой скрипта'; alert('Исключение: ' + err); }
      }

      // * wrapSel
      /* ── HTML-поле: панель кнопок и живой предпросмотр ── */
      function wrapSel(ta, before, after) {
        const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
        ta.value = v.slice(0, s) + before + v.slice(s, e) + after + v.slice(e);
        ta.focus();
        ta.selectionStart = s + before.length;
        ta.selectionEnd = e + before.length;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }



      // * listSel
      /* Умный список: разбивает выделение по строкам на <li>,
   счищает ведущие дефисы/нумерацию; без выделения — пустой каркас */
      function listSel(ta, tag) {
        const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
        const lines = v.slice(s, e).split(/\r?\n/).map(l => l.replace(/^[-•*\d.)\s]+/, '').trim()).filter(Boolean);
        const items = (lines.length ? lines : ['']).map(l => '  <li>' + l + '</li>').join('\n');
        const insert = tag === 'li'
          ? items
          : '<' + tag + (tag === 'ul' ? " class='text-block-list'" : '') + '>\n' + items + '\n</' + tag + '>';
        ta.value = v.slice(0, s) + insert + v.slice(e);
        ta.focus();
        ta.selectionStart = ta.selectionEnd = s + insert.length;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }

      document.addEventListener('click', e => {
        const b = e.target.closest('.html-tools button');
        if (!b) return;
        const ta = document.getElementById(b.closest('.html-tools').dataset.target);
        if (!ta) return;
        if (b.dataset.list) { listSel(ta, b.dataset.list); return; }
        const [before, after] = b.dataset.wrap.split('|');
        wrapSel(ta, before, after);
      });

      document.addEventListener('input', e => {
        const f = e.target.dataset ? e.target.dataset.f : '';
        const prev = f ? document.getElementById('prev-' + f) : null;
        if (prev) prev.innerHTML = e.target.value;
      });

      /* Авто-ФИО коротко: при уходе с поля «ФИО полное», если короткое пустое */
      document.addEventListener('blur', e => {
        if (e.target.dataset && e.target.dataset.f === 'name') {
          const shortInput = document.querySelector('[data-f="short"]');
          if (shortInput && !shortInput.value.trim()) shortInput.value = makeShort(e.target.value);
        }
      }, true);

      if (TOK) load();
    </script>
  </div>
</body>

</html>
