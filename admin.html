<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — портфолио</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
 body{background:#f5f3ec;font-family:Arial,sans-serif;font-size:.85rem}
 .card{border-radius:14px}
 table.ed input{width:100%;border:1px solid #dcd7c9;border-radius:6px;padding:.25rem .4rem;font-size:.8rem}
 table.ed td{padding:2px}
</style></head>
<body><div class="container py-4" style="max-width:1100px">

<div id="login" class="card p-4 mx-auto" style="max-width:420px">
  <h5>Вход в админку</h5>
  <input id="gate" type="password" class="form-control mb-2" placeholder="Локальный пароль (если задан)">
  <input id="token" type="password" class="form-control mb-2" placeholder="GitHub Personal Access Token">
  <button class="btn btn-dark" onclick="login()">Войти</button>
  <small class="text-secondary mt-2">Токен хранится только в вашей вкладке браузера и нужен для записи в репозиторий.</small>
</div>

<div id="app" style="display:none">
  <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
    <select id="tsel" class="form-select" style="max-width:320px" onchange="cur=+this.value;build()"></select>
    <button class="btn btn-outline-dark btn-sm" onclick="addTeacher()">+ преподаватель</button>
    <button class="btn btn-outline-danger btn-sm" onclick="delTeacher()">Удалить</button>
    <button class="btn btn-success btn-sm ms-auto" onclick="save()">Сохранить и опубликовать</button>
    <span id="status"></span>
  </div>
  <div class="card p-3 mb-3"><h6>Личные данные</h6><div id="pf" class="row g-2"></div></div>
  <div id="secs"></div>
</div>
<script>
/* ═══ НАСТРОЙКИ ═══ */
const OWNER='ВАШ_ЛОГИН', REPO='portfolio-kafedra', PATH='data/teachers.json';
const GATE='';            // необязательный локальный пароль-ширма, напр. 'kafedra2026'
/* ═════════════════ */
const FIELDS=[['id','ID (латиницей)'],['name','ФИО'],['short','ФИО коротко'],['faculty','Факультет'],['post','Должность'],['photo','URL фото'],['email','E-mail'],['phone','Телефон'],['address','Адрес'],['hours','Приёмные часы'],['science_text','Текст о научных интересах']];
const KEYS={education:['year','title','text'],upk:['year','title','text'],career:['year','title','text'],
 achievements:['tag','title','text'],programs:['tag','title','text'],books:['year','title','text','tag'],
 publications:['year','title','text','tag'],patents:['year','title','text','tag'],projects:['year','title','text'],
 social:['year','title','text'],courses:['a','b','c','d','e'],schedule:['a','b','c','d','e','f'],session:['a','b','c','d','e','f'],
 news:['date','title','img','url'],metrics:['n','l'],profiles:['t','u'],events:['t','x'],chips:['*'],positions:['*']};
const NAMES={education:'Образование',upk:'Повышение квалификации',career:'Карьера',achievements:'Достижения',
 programs:'Программы',books:'Пособия',publications:'Публикации',patents:'Патенты',projects:'Проекты',social:'Общественная',
 courses:'Дисциплины (таблица)',schedule:'Расписание (таблица)',session:'Сессия (таблица)',news:'Новости',
 metrics:'Метрики',profiles:'Профили',events:'События',chips:'Чипсы',positions:'Должности (верхний блок)'};
let TOK=sessionStorage.tok||'', data=null, cur=0;
const H={'Authorization':'Bearer '+(()=>TOK)(),'Content-Type':'application/json'};
const gh=(u,o)=>fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+u,{...o,headers:{Authorization:'Bearer '+TOK,'Content-Type':'application/json'}});
function login(){
  if(GATE && document.getElementById('gate').value!==GATE) return alert('Неверный пароль');
  TOK=document.getElementById('token').value.trim(); sessionStorage.tok=TOK; load();
}
async function load(){
  const r=await gh('/contents/'+PATH); if(!r.ok) return alert('Токен не принят: '+r.status);
  data=JSON.parse(decodeURIComponent(escape(atob((await r.json()).content))));
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='';
  buildSel(); build();
}
function buildSel(){document.getElementById('tsel').innerHTML=data.teachers.map((t,i)=>`<option value="${i}">${t.name||t.id}</option>`).join('');document.getElementById('tsel').value=cur;}
function build(){
  const t=data.teachers[cur];
  document.getElementById('pf').innerHTML=FIELDS.map(([k,l])=>`<div class="col-md-4"><label class="small text-secondary">${l}</label><input class="form-control form-control-sm" data-f="${k}" value="${(t[k]||'').replace(/"/g,'&quot;')}"></div>`).join('');
  document.getElementById('secs').innerHTML=Object.keys(KEYS).map(k=>{
    const arr=Array.isArray(t[k])?t[k]:(t[k]=[]);
    return `<details class="card p-2 mb-2"><summary class="fw-bold">${NAMES[k]}</summary>
      <table class="ed mt-2">${arr.map((row,i)=>`<tr>${KEYS[k].map(c=>`<td><input data-sec="${k}" data-i="${i}" data-k="${c}" value="${String(c==='*'?row:(row[c]||'')).replace(/"/g,'&quot;')}"></td>`).join('')}<td><button class="btn btn-sm btn-outline-danger" onclick="rm('${k}',${i})">✕</button></td></tr>`).join('')}</table>
      <button class="btn btn-sm btn-outline-dark mt-1" onclick="add('${k}')">+ строка</button></details>`;
  }).join('');
}
function collect(){
  const t=data.teachers[cur];
  document.querySelectorAll('[data-f]').forEach(i=>t[i.dataset.f]=i.value);
  Object.keys(KEYS).forEach(k=>{t[k]=[];});
  document.querySelectorAll('[data-sec]').forEach(i=>{
    const {sec,i:idx,k}=i.dataset, row=(t[sec][+idx]=t[sec][+idx]||(KEYS[sec][0]==='*'?'':{}));
    if(k==='*') t[sec][+idx]=i.value; else row[k]=i.value;
  });
}
function add(k){collect();const t=data.teachers[cur];t[k].push(KEYS[k][0]==='*'? '':Object.fromEntries(KEYS[k].map(c=>[c,''])));build();}
function rm(k,i){collect();data.teachers[cur][k].splice(i,1);build();}
function addTeacher(){collect();data.teachers.push({id:'new'+Date.now(),name:'Новый преподаватель',chips:[],positions:[],education:[],career:[],news:[]});cur=data.teachers.length-1;buildSel();build();}
function delTeacher(){if(!confirm('Удалить преподавателя?'))return;collect();data.teachers.splice(cur,1);cur=0;buildSel();build();}
async function save(){
  collect();
  document.getElementById('status').textContent='публикую…';
  const g=await gh('/contents/'+PATH); const cur_file=await g.json();
  const body={message:'admin: update '+new Date().toISOString(),
    content:unescape(encodeURIComponent(JSON.stringify(data,null,1))), sha:cur_file.sha};
  const r=await gh('/contents/'+PATH,{method:'PUT',body:JSON.stringify(body)});
  document.getElementById('status').textContent=r.ok?'✔ опубликовано (Pages обновится за ~1 мин)':'✗ ошибка '+r.status;
}
if(TOK) load();
</script></body></html>
