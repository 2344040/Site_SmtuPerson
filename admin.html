<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — портфолио</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f3ec;
      font-family: Arial, sans-serif;
      font-size: .85rem
    }

    .card {
      border-radius: 14px
    }

    table.ed input {
      width: 100%;
      border: 1px solid #dcd7c9;
      border-radius: 6px;
      padding: .25rem .4rem;
      font-size: .8rem
    }

    table.ed td {
      padding: 2px
    }
  </style>
</head>

<body>
  <div class="container py-4" style="max-width:1100px">

    <div id="login" class="card p-4 mx-auto" style="max-width:420px">
      <h5>Вход в админку</h5>
      <input id="gate" type="password" class="form-control mb-2" placeholder="Локальный пароль (если задан)">
      <input id="token" type="password" class="form-control mb-2" placeholder="GitHub Personal Access Token">
      <button class="btn btn-dark" onclick="login()">Войти</button>
      <small class="text-secondary mt-2">Токен хранится только в вашей вкладке браузера и нужен для записи в репозиторий.</small>
    </div>

    <div id="app" style="display:none">
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <select id="tsel" class="form-select" style="max-width:320px" onchange="cur=+this.value;build()"></select>
        <button class="btn btn-outline-dark btn-sm" onclick="addTeacher()">+ преподаватель</button>
        <button class="btn btn-outline-danger btn-sm" onclick="delTeacher()">Удалить</button>
        <button class="btn btn-success btn-sm ms-auto" onclick="save()">Сохранить и опубликовать</button>
        <span id="status"></span>
      </div>
      <div class="card p-3 mb-3">
        <h6>Личные данные</h6>
        <div id="pf" class="row g-2"></div>
      </div>
      <div id="secs"></div>
    </div>
    <script>



      /* ═══ НАСТРОЙКИ ═══ */
      const OWNER = '2344040', REPO = 'Site_SmtuPerson', PATH = 'data/teachers.json';

      const GATE = '';
      const FIELDS = [
        ['id', 'ID (латиницей)', 'col-md-3'],
        ['name', 'ФИО полное', 'col-md-6'],
        ['short', 'ФИО коротко', 'col-md-3'],
        ['faculty', 'Факультет', 'col-md-9'],
        ['university', 'Университет (кратко)', 'col-md-2'],
        ['post', 'Должность под ФИО', 'col-md-12'],
        ['photo', 'URL фото', 'col-md-8'],
        ['email', 'E-mail', 'col-md-4'],
        ['phone', 'Телефон', 'col-md-4'],
        ['address', 'Адрес', 'col-md-8'],
        ['hours', 'Приёмные часы', 'col-md-4'],
        ['share_tg_url', 'URL для Telegram share', 'col-md-6'],
        ['share_vk_url', 'URL для VK share', 'col-md-6'],
      ];
      const KEYS = {
        chips: ['*'], positions: ['*'],
        education: ['year', 'title', 'text'], upk: ['year', 'title', 'text'],
        career: ['year', 'title', 'text'],
        achievements: ['year', 'icon', 'title', 'text'],  // icon = award / trophy
        programs: ['tag', 'title', 'text'],
        courses: ['a', 'b', 'c', 'd', 'e'],
        schedule: ['a', 'b', 'c', 'd', 'e', 'f'],
        session: ['a', 'b', 'c', 'd', 'e', 'f'],
        books: ['year', 'title', 'text', 'tag'],
        publications: ['year', 'title', 'text', 'tag', 'link', 'doi'],
        patents: ['year', 'title', 'text', 'tag'],
        projects: ['year', 'title', 'text'],
        social: ['title', 'text'],
        metrics: ['n', 'l'],
        events: ['t', 'x', 'now'],   // t = заголовок, x = описание, now = true/false
        profiles: ['t', 'u'],
        news: ['date', 'title', 'img', 'url']
      };
      const NAMES = {
        chips: 'Чипсы', positions: 'Должности (верхний блок)',
        education: 'Образование', upk: 'Повышение квалификации',
        career: 'Карьера', achievements: 'Профессиональные достижения',
        programs: 'Программы', courses: 'Дисциплины', schedule: 'Расписание', session: 'Сессия',
        books: 'Пособия', publications: 'Публикации', patents: 'Патенты', projects: 'Проекты',
        social: 'Общественная деятельность', metrics: 'Метрики науки', events: 'События (правый сайдбар)',
        profiles: 'Профили (правый сайдбар)', news: 'Новости'
      };




      let TOK = sessionStorage.tok || '', data = null, cur = 0;
      const H = { 'Authorization': 'Bearer ' + (() => TOK)(), 'Content-Type': 'application/json' };
      const gh = (u, o) => fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + u, { ...o, headers: { Authorization: 'Bearer ' + TOK, 'Content-Type': 'application/json' } });
      function login() {
        if (GATE && document.getElementById('gate').value !== GATE) return alert('Неверный пароль');
        TOK = document.getElementById('token').value.trim(); sessionStorage.tok = TOK; load();
      }
      async function load() {
        const r = await gh('/contents/' + PATH); if (!r.ok) return alert('Токен не принят: ' + r.status);
        data = JSON.parse(decodeURIComponent(escape(atob((await r.json()).content))));
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = '';
        buildSel(); build();
      }
      function buildSel() { document.getElementById('tsel').innerHTML = data.teachers.map((t, i) => `<option value="${i}">${t.name || t.id}</option>`).join(''); document.getElementById('tsel').value = cur; }



      function build() {
        const t = data.teachers[cur];

        /* Личные данные — как было */
        document.getElementById('pf').innerHTML = FIELDS.map(f => {
          const [k, l, w] = f;                       // ← распаковываем ширину
          return `<div class="${w || 'col-md-4'}">   // ← подставляем её (по умолчанию col-md-4)
    <label class="small text-secondary">${l}</label>
    <input class="form-control form-control-sm" data-f="${k}"
           value="${(t[k] || '').replace(/"/g, '&quot;')}"></div>`;
        }).join('');

        // ════════════════════════════════════════════════
        // ← НОВОЕ: блок «Внешние ссылки» перед списком секций
        // ════════════════════════════════════════════════
        const extBlock = `
    <details class="card p-2 mb-2" open>
      <summary class="fw-bold">Внешние ссылки</summary>
      <div class="row g-2 mt-2">
        <div class="col-md-6">
          <label class="small text-secondary">URL расписания (внешняя ссылка)</label>
          <input class="form-control form-control-sm" data-ext="schedule"
                 value="${(t.external_links?.schedule || '').replace(/"/g, '&quot;')}">
        </div>
      </div>
    </details>`;

        /* Список секций — почти как было, но внутри рендера строки
           добавлена поддержка чекбокса для поля `now` в events */
        document.getElementById('secs').innerHTML = extBlock + Object.keys(KEYS).map(k => {
          const arr = Array.isArray(t[k]) ? t[k] : (t[k] = []);
          return `<details class="card p-2 mb-2">
      <summary class="fw-bold">${NAMES[k]}</summary>
      <table class="ed mt-2">${arr.map((row, i) => `<tr>${KEYS[k].map(c => {
            const isArrItem = KEYS[k][0] === '*';
            const val = isArrItem ? row : (row[c] || '');

            // ← НОВОЕ: для events.now рендерим чекбокс вместо input
            if (k === 'events' && c === 'now') {
              return `<td><input type="checkbox"
                        data-sec="${k}" data-i="${i}" data-k="${c}"
                        ${val ? 'checked' : ''}></td>`;
            }
            return `<td><input data-sec="${k}" data-i="${i}" data-k="${c}"
                       value="${String(val).replace(/"/g, '&quot;')}"></td>`;
          }).join('')
            }<td><button class="btn btn-sm btn-outline-danger"
                   onclick="rm('${k}',${i})">✕</button></td></tr>`).join('')}
      </table>
      <button class="btn btn-sm btn-outline-dark mt-1"
              onclick="add('${k}')">+ строка</button>
    </details>`;
        }).join('');
      }


      function collect() {
        const t = data.teachers[cur];

        /* Собираем личные данные — как было */
        document.querySelectorAll('[data-f]').forEach(i => t[i.dataset.f] = i.value);

        // ← НОВОЕ: собираем блок «Внешние ссылки»
        if (!t.external_links) t.external_links = {};
        document.querySelectorAll('[data-ext]').forEach(i => {
          t.external_links[i.dataset.ext] = i.value;
        });

        /* Сбрасываем все массивы секций — как было */
        Object.keys(KEYS).forEach(k => { t[k] = []; });

        /* Собираем данные из таблиц секций — почти как было,
           но с поддержкой чекбоксов */
        document.querySelectorAll('[data-sec]').forEach(i => {
          const { sec, i: idx, k } = i.dataset;
          const row = (t[sec][+idx] = t[sec][+idx] || (KEYS[sec][0] === '*' ? '' : {}));

          const isArrItem = KEYS[sec][0] === '*';
          const isCheckbox = i.type === 'checkbox';

          // ← НОВОЕ: если это чекбокс — читаем .checked, иначе .value
          if (isArrItem) {
            t[sec][+idx] = i.value;
          } else {
            row[k] = isCheckbox ? i.checked : i.value;
          }
        });
      }


      function add(k) { collect(); const t = data.teachers[cur]; t[k].push(KEYS[k][0] === '*' ? '' : Object.fromEntries(KEYS[k].map(c => [c, '']))); build(); }
      function rm(k, i) { collect(); data.teachers[cur][k].splice(i, 1); build(); }
      function addTeacher() { collect(); data.teachers.push({ id: 'new' + Date.now(), name: 'Новый преподаватель', chips: [], positions: [], education: [], career: [], news: [] }); cur = data.teachers.length - 1; buildSel(); build(); }
      function delTeacher() { if (!confirm('Удалить преподавателя?')) return; collect(); data.teachers.splice(cur, 1); cur = 0; buildSel(); build(); }


      async function save() {
        collect();
        const st = document.getElementById('status');
        st.textContent = 'v3: сохраняю…';          // маркер версии: видите "v3:" — код новый
        try {
          const g = await gh('/contents/' + PATH);
          if (!g.ok) {
            const e = await g.json().catch(() => ({}));
            alert('Не удалось прочитать файл:\nGET ' + g.status + '\n' + (e.message || ''));
            st.textContent = '✗ GET ' + g.status; return;
          }
          const cur = await g.json();

          const json = JSON.stringify(data, null, 1);
          const b64 = btoa(unescape(encodeURIComponent(json)));   // base64 с поддержкой кириллицы

          const r = await gh('/contents/' + PATH, {
            method: 'PUT',
            body: JSON.stringify({
              message: 'admin: update ' + new Date().toISOString(),
              content: b64, sha: cur.sha
            })
          });
          const res = await r.json().catch(() => ({}));
          console.log('PUT', r.status, res);
          if (r.ok) {
            st.textContent = '✔ опубликовано (Pages обновится за ~1 мин)';
          } else {
            st.textContent = '✗ ' + r.status;
            alert('Ошибка ' + r.status + '\n' + (res.message || JSON.stringify(res)));
          }
        } catch (err) {
          st.textContent = '✗ сбой скрипта';
          alert('Исключение: ' + err);
        }
      }
      if (TOK) load();
    </script>
</body>

</html>
